# Package boundaries; run with `just boundaries` after a workspace sync, since Import Linter
# reads the installed packages. Annotation-only imports count: exclude_type_checking_imports
# stays off, so a TYPE_CHECKING import across a boundary also fails.
[tool.importlinter]
root_packages = ["opendart", "opendart_analysis", "opendart_mcp"]
# Graph third-party packages too, so the contracts can forbid MCP frameworks by name.
include_external_packages = true

# Analysis receives bytes, records, and callbacks, never an SDK client, and has no MCP runtime.
[[tool.importlinter.contracts]]
id = "analysis-independent"
name = "Analysis imports neither the SDK, MCP, nor server frameworks"
type = "forbidden"
source_modules = ["opendart_analysis"]
forbidden_modules = ["opendart", "opendart_mcp", "fastmcp", "mcp", "mcp_types", "opentelemetry"]

# The SDK is the raw API contract; interpretation and MCP build on it, not inside it.
[[tool.importlinter.contracts]]
id = "sdk-independent"
name = "The SDK imports neither analysis, MCP, nor server frameworks"
type = "forbidden"
source_modules = ["opendart"]
forbidden_modules = ["opendart_analysis", "opendart_mcp", "fastmcp", "mcp", "mcp_types", "opentelemetry"]

# Parsing, search, and rendering stay pure; only the package exports reach the runtime store.
[[tool.importlinter.contracts]]
id = "documents-pure"
name = "Pure document modules do not reach the runtime store"
type = "forbidden"
source_modules = ["opendart_analysis.documents.*"]
forbidden_modules = ["opendart_analysis.documents.store"]

# Company lookup is pure and synchronous: no runtime store, no async machinery, no background work,
# and no caller-supplied data access, which belongs to the workflows built on these primitives.
[[tool.importlinter.contracts]]
id = "domain-pure"
name = "Company-domain and directory modules reach neither the document store, AnyIO, nor data access"
type = "forbidden"
source_modules = ["opendart_analysis.domain", "opendart_analysis.directory"]
forbidden_modules = [
    "opendart_analysis.documents.store",
    "anyio",
    "opendart_analysis.upstream",
    "opendart_analysis.reports",
]

# The data-access convention and failure categories are leaves every capability can import.
[[tool.importlinter.contracts]]
id = "conventions-leaf"
name = "Data-access and error conventions import no capability or framework"
type = "forbidden"
source_modules = ["opendart_analysis.upstream", "opendart_analysis.errors"]
forbidden_modules = [
    "opendart_analysis.documents",
    "opendart_analysis.directory",
    "opendart_analysis.domain",
    "opendart_analysis.reports",
    "anyio",
    "pydantic",
]
