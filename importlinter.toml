    "opendart_analysis.calendar.lookback",
    "opendart_analysis.events.fetch",
    "opendart_analysis.events.index",
    "opendart_analysis.filings",
    "opendart_analysis.debt",
    "opendart_analysis.reports",
    "opendart_analysis.extracts",
    "opendart_analysis.upstream",
    "opendart_analysis.documents",
    "anyio",
]

[[tool.importlinter.contracts]]
id = "calendar-layers"
name = "Calendar assembly sits above reading, which sits above requests, lookback, and items"
type = "layers"
containers = ["opendart_analysis.calendar"]
layers = ["assemble", "reads | maturities", "request | lookback", "items"]
