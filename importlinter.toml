# Package boundaries; run with `just boundaries` after a workspace sync, since Import Linter
# reads the installed packages. Annotation-only imports count: exclude_type_checking_imports
# stays off, so a TYPE_CHECKING import across a boundary also fails.
[tool.importlinter]
root_packages = ["opendart", "opendart_analysis", "opendart_mcp"]
# Graph third-party packages too, so the contracts can forbid MCP frameworks by name.
include_external_packages = true

# Analysis receives bytes, records, and callbacks, never an SDK client, and has no MCP runtime.
[[tool.importlinter.contracts]]
id = "analysis-independent"
name = "Analysis imports neither the SDK, MCP, nor server frameworks"
type = "forbidden"
source_modules = ["opendart_analysis"]
forbidden_modules = ["opendart", "opendart_mcp", "fastmcp", "mcp", "mcp_types", "opentelemetry"]

# The SDK is the raw API contract; interpretation and MCP build on it, not inside it.
[[tool.importlinter.contracts]]
id = "sdk-independent"
name = "The SDK imports neither analysis, MCP, nor server frameworks"
type = "forbidden"
source_modules = ["opendart"]
forbidden_modules = ["opendart_analysis", "opendart_mcp", "fastmcp", "mcp", "mcp_types", "opentelemetry"]

# Parsing, search, and rendering stay pure; only the package exports reach the runtime store.
[[tool.importlinter.contracts]]
id = "documents-pure"
name = "Pure document modules do not reach the runtime store"
type = "forbidden"
source_modules = ["opendart_analysis.documents.*"]
forbidden_modules = ["opendart_analysis.documents.store"]

# Company lookup is pure and synchronous: no runtime store, no async machinery, no background work,
# and no caller-supplied data access, which belongs to the workflows built on these primitives.
[[tool.importlinter.contracts]]
id = "domain-pure"
name = "Company-domain and directory modules reach neither the document store, AnyIO, nor data access"
type = "forbidden"
source_modules = ["opendart_analysis.domain", "opendart_analysis.directory"]
forbidden_modules = [
    "opendart_analysis.documents.store",
    "anyio",
    "opendart_analysis.upstream",
    "opendart_analysis.reports",
    "opendart_analysis.extracts",
    "opendart_analysis.events",
    "opendart_analysis.filings",
    "opendart_analysis.financials",
]

# The data-access convention and failure categories are leaves every capability can import.
[[tool.importlinter.contracts]]
id = "conventions-leaf"
name = "Data-access and error conventions import no capability or framework"
type = "forbidden"
source_modules = ["opendart_analysis.upstream", "opendart_analysis.errors"]
forbidden_modules = [
    "opendart_analysis.documents",
    "opendart_analysis.directory",
    "opendart_analysis.domain",
    "opendart_analysis.reports",
    "opendart_analysis.extracts",
    "opendart_analysis.events",
    "opendart_analysis.filings",
    "opendart_analysis.financials",
    "anyio",
    "pydantic",
]

# Periodic-report extracts read records through caller-supplied data access only.
[[tool.importlinter.contracts]]
id = "extracts-leaf"
name = "Extracts depend only on the domain, reports, catalog, and conventions"
type = "forbidden"
source_modules = ["opendart_analysis.extracts"]
forbidden_modules = ["opendart_analysis.documents", "opendart_analysis.directory", "pydantic"]

# Event semantics interpret records; fetching and the filing index sit above them.
[[tool.importlinter.contracts]]
id = "events-semantics-pure"
name = "Event semantics reach neither fetching, the filing index, nor data access"
type = "forbidden"
source_modules = [
    "opendart_analysis.events.catalog",
    "opendart_analysis.events.dates",
    "opendart_analysis.events.flags",
    "opendart_analysis.events.kinds_capital",
    "opendart_analysis.events.kinds_deals",
    "opendart_analysis.events.kinds_other",
    "opendart_analysis.events.records",
    "opendart_analysis.events.templates",
    "opendart_analysis.events.titles",
    "opendart_analysis.events.values",
]
forbidden_modules = [
    "opendart_analysis.events.fetch",
    "opendart_analysis.events.index",
    "opendart_analysis.filings",
    "opendart_analysis.upstream",
    "opendart_analysis.documents.store",
    "anyio",
]

# Filing discovery is the lower layer: events read the filing index, never the reverse.
[[tool.importlinter.contracts]]
id = "filings-before-events"
name = "Filing discovery does not import event workflows"
type = "forbidden"
source_modules = ["opendart_analysis.filings"]
forbidden_modules = ["opendart_analysis.events"]

# Financial calculations are pure: workflows, data access, and concurrency sit above them.
[[tool.importlinter.contracts]]
id = "financials-calculations-pure"
name = "Financial calculations reach neither financial workflows, period resolution, nor AnyIO"
type = "forbidden"
source_modules = [
    "opendart_analysis.financials.accounts",
    "opendart_analysis.financials.derived",
    "opendart_analysis.financials.quarters",
    "opendart_analysis.financials.specs",
    "opendart_analysis.financials.statements",
]
forbidden_modules = [
    "opendart_analysis.financials.chain",
    "opendart_analysis.financials.history",
    "opendart_analysis.financials.indicators",
    "opendart_analysis.financials.investments",
    "opendart_analysis.financials.peers",
    "opendart_analysis.financials.preliminary",
    "opendart_analysis.reports.periodic",
    "opendart_analysis.documents.store",
    "anyio",
]
