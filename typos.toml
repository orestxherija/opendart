#:schema https://raw.githubusercontent.com/crate-ci/typos/v1.48.0/config.schema.json

[files]
ignore-hidden = false
ignore-parent = false
extend-exclude = [
    ".git/**",
    # Keep upstream plugin snapshots and wire data unchanged.
    ".agents/plugins/python-conventions/**",
    "api_reference/sources/**",
    "api_reference/**/*.yaml",
    "uv.lock",
    "scripts/api_reference/package-lock.json",
    # Generated models/resources contain the upstream guide's exact prose and names.
    # The handwritten model base, transport, generator, tests, and docs remain checked.
    "packages/sdk/src/opendart/models/__init__.py",
    "packages/sdk/src/opendart/models/disclosures.py",
    "packages/sdk/src/opendart/models/equity_disclosures.py",
    "packages/sdk/src/opendart/models/financial_statements.py",
    "packages/sdk/src/opendart/models/major_issues.py",
    "packages/sdk/src/opendart/models/periodic_reports.py",
    "packages/sdk/src/opendart/models/securities_registration.py",
    "packages/sdk/src/opendart/resources/disclosures.py",
    "packages/sdk/src/opendart/resources/equity_disclosures.py",
    "packages/sdk/src/opendart/resources/financial_statements.py",
    "packages/sdk/src/opendart/resources/major_issues.py",
    "packages/sdk/src/opendart/resources/periodic_reports.py",
    "packages/sdk/src/opendart/resources/securities_registration.py",
    # Generated by scripts/generate_mcp_registry.py; keeps the catalog's labels verbatim,
    # including upstream misspellings. The generator and the registry modules remain checked.
    "packages/mcp/src/opendart_mcp/registry/_generated.py",
]

[default]
locale = "en"

[default.extend-words]
# Ruff's copyright rule prefix, and upstream endpoint names used in docs/tests.
cpy = "cpy"
singl = "singl"
indx = "indx"
inh = "inh"

[default.extend-identifiers]
# Upstream company-overview field and Pydantic's serialization option, used by the MCP server.
adres = "adres"
ser_json_inf_nan = "ser_json_inf_nan"
# Generated SDK method names cited in the MCP component design document.
accnut_adtor_nm_nd_adt_opinion = "accnut_adtor_nm_nd_adt_opinion"
cndl_capl_scrits_nrdmp_blce = "cndl_capl_scrits_nrdmp_blce"
det_scrits_isu_acmslt = "det_scrits_isu_acmslt"
entrprs_bil_scrits_nrdmp_blce = "entrprs_bil_scrits_nrdmp_blce"
new_capl_scrits_nrdmp_blce = "new_capl_scrits_nrdmp_blce"
outcmpny_drctr_nd_change_sttus = "outcmpny_drctr_nd_change_sttus"
# Upstream event report fields ("total assets" ratio columns) used by the events package.
inhdtl_tast_vs = "inhdtl_tast_vs"
trfdtl_tast_vs = "trfdtl_tast_vs"
# Upstream capital-change field (issuance or reduction type) used by get_capital_structure.
isu_dcrs_stle = "isu_dcrs_stle"
# Upstream debt, audit, and workforce fields and endpoints used by get_debt_profile and get_governance.
scrits_knd_nm = "scrits_knd_nm"
fo_bbm = "fo_bbm"
accnutAdtorNmNdAdtOpinion = "accnutAdtorNmNdAdtOpinion"
cndlCaplScritsNrdmpBlce = "cndlCaplScritsNrdmpBlce"
detScritsIsuAcmslt = "detScritsIsuAcmslt"
entrprsBilScritsNrdmpBlce = "entrprsBilScritsNrdmpBlce"
newCaplScritsNrdmpBlce = "newCaplScritsNrdmpBlce"
outcmpnyDrctrNdChangeSttus = "outcmpnyDrctrNdChangeSttus"
# Upstream equity-investment fields (first acquisition date and amount) used by get_financials.
frst_acqs_de = "frst_acqs_de"
frst_acqs_amount = "frst_acqs_amount"
