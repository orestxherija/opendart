required-version = ">=0.17.1,<0.18.0"
target-version = "py314"
line-length = 100
indent-width = 4
cache-dir = ".cache/.ruff"
force-exclude = true
respect-gitignore = true
output-format = "full"
show-fixes = true
fix = false
fix-only = false
unsafe-fixes = false
preview = false
src = [".", "packages/sdk/src", "packages/mcp/src"]
extend-exclude = [".agents", ".codex"]
include = ["*.py", "*.pyi", "*.pyw", "*.ipynb", "*.md", "**/pyproject.toml", "**/ruff.toml", "**/.ruff.toml"]


[lint]
select = ["ALL"]
fixable = ["ALL"]
future-annotations = true
task-tags = ["TODO", "FIXME", "HACK", "BUG"]
typing-extensions = true
preview = false
external = []
explicit-preview-rules = true
ignore = [
    "CPY001",
    "TD002",
    "FIX002",
    "ANN401",
    "E501",
    "W191",
    "E111",
    "E114",
    "E117",
    "D203",
    "D206",
    "D300",
    "Q000",
    "Q001",
    "Q002",
    "Q003",
    "Q004",
    "COM812",
    "COM819",
]

[lint.per-file-ignores]
# Standalone CLI and generation scripts have dynamic inputs and print progress.
"{scripts,.github/scripts}/**" = [
    "ANN",
    "BLE001",
    "C901",
    "D1",
    "EM",
    "EXE001",
    "INP001",
    "ISC002",
    "ISC004",
    "PLC0415",
    "PLR09",
    "T201",
    "TRY003",
    "TRY301",
]
# Beyond the usual test relaxations: PLC0415 because an import inside a test keeps the
# test self-contained; EM/TRY003 because a mock handler raises library errors inline;
# S105/S106 because every credential in this suite is a visible placeholder.
"**/tests/**" = [
    "ANN",
    "D",
    "FBT003",
    "INP001",
    "PLR09",
    "PT006",
    "PT011",
    "PT012",
    "S101",
    "ARG001",
    "EM",
    "PLC0415",
    "PLR2004",
    "S105",
    "S106",
    "SLF001",
    "TC",
    "TRY003",
    "W505",
]
"**/test_*.py" = [
    "ANN",
    "D",
    "FBT003",
    "INP001",
    "PLR09",
    "PT006",
    "PT011",
    "PT012",
    "S101",
    "ARG001",
    "EM",
    "PLC0415",
    "PLR2004",
    "S105",
    "S106",
    "SLF001",
    "TC",
    "TRY003",
    "W505",
]
"**/*_test.py" = [
    "ANN",
    "D",
    "FBT003",
    "INP001",
    "PLR09",
    "PT006",
    "PT011",
    "PT012",
    "S101",
    "ARG001",
    "EM",
    "PLC0415",
    "PLR2004",
    "S105",
    "S106",
    "SLF001",
    "TC",
    "TRY003",
    "W505",
]
"**/conftest.py" = [
    "ANN",
    "D",
    "FBT003",
    "INP001",
    "PLR09",
    "PT006",
    "PT011",
    "PT012",
    "S101",
    "ARG001",
    "EM",
    "PLC0415",
    "PLR2004",
    "S105",
    "S106",
    "SLF001",
    "TC",
    "TRY003",
    "W505",
]
# Generated OpenAPI descriptions preserve upstream punctuation and long field prose.
"packages/sdk/src/opendart/models/**" = ["RUF001", "RUF002", "TC003", "W505"]
"packages/sdk/src/opendart/resources/**" = ["PLR0913", "RUF001", "RUF002", "W505"]
# The transport raises public SDK error classes with stable messages and uses
# numeric HTTP status boundaries. Keep those visible at the call site.
"packages/sdk/src/opendart/_transport.py" = ["EM", "PLR0912", "PLR0917", "PLR2004", "TRY003", "TRY301"]
"packages/sdk/src/opendart/settings.py" = ["EM", "TRY003"]
# The default bind address is intentionally configurable as 0.0.0.0 for containers.
"packages/mcp/src/opendart_mcp/settings.py" = ["S104"]
# Pydantic resolves output-model field annotations at runtime.
"packages/mcp/src/opendart_mcp/models/**" = ["TC001", "TC002", "TC003"]
# Tool parameters are the published MCP input schema, so their count follows the design.
"packages/mcp/src/opendart_mcp/tools/**" = ["PLR0913"]
# FastMCP appends a JSON-schema note to every prompt argument whose annotation is not the str
# object, which string annotations are, so prompt modules omit the future import.
"packages/mcp/src/opendart_mcp/prompts/**" = ["I002"]
# Generated by scripts/generate_mcp_registry.py; catalog labels keep typographic quotes.
"packages/mcp/src/opendart_mcp/registry/_generated.py" = ["RUF001"]
"packages/mcp/tests/test_mcp_settings.py" = ["S104"]
# The reference tools consume controlled repo files and print audit progress.
"scripts/api_reference/build.py" = ["ARG002", "RUF001"]
"scripts/api_reference/check.py" = ["FBT002", "FBT003", "PLR2004", "RUF005", "S603"]
"scripts/api_reference/snapshot.py" = ["C408", "PLR2004", "W505"]
"scripts/generate_sdk.py" = ["S603"]
# The CI selector runs Git with fixed arguments.
".github/scripts/select_components.py" = ["S603", "S607"]
# Runs the pinned conformance suite through npx.
"scripts/check_mcp_conformance.py" = ["S603"]
# CI selection tests drive Git in temporary repositories.
"tests/ci/**" = ["S603", "S607"]
# The contract harness intentionally uses subprocesses, broad fixture callbacks,
# and a linear request runner so its bounded audit steps remain visible.
"tests/contracts/**" = [
    "ARG002",
    "ARG005",
    "BLE001",
    "C901",
    "ISC002",
    "ISC004",
    "N818",
    "PERF401",
    "PLR09",
    "PLW1510",
    "PLW2901",
    "PT011",
    "RUF012",
    "S603",
    "S607",
    "T201",
    "TRY301",
]
"**/*.ipynb" = ["D100"]

[lint.flake8-annotations]
allow-star-arg-any = false
ignore-fully-untyped = false
mypy-init-return = false
suppress-dummy-args = false
suppress-none-returning = false

[lint.flake8-bandit]
check-typed-exception = true
hardcoded-tmp-directory = ["/tmp", "/var/tmp", "/dev/shm"]

[lint.flake8-bugbear]
extend-immutable-calls = ["fastmcp.dependencies.CurrentContext", "fastmcp.dependencies.Depends"]

[lint.flake8-builtins]
strict-checking = false

[lint.flake8-comprehensions]
allow-dict-calls-with-keyword-arguments = false

[lint.flake8-errmsg]
max-string-length = 0

[lint.flake8-implicit-str-concat]
allow-multiline = false

[lint.flake8-import-conventions]
aliases = {}

[lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false
parametrize-names-type = "tuple"
parametrize-values-type = "list"
parametrize-values-row-type = "tuple"
raises-extend-require-match-for = [
    "AssertionError",
    "AttributeError",
    "ImportError",
    "KeyError",
    "LookupError",
    "NotImplementedError",
    "RuntimeError",
    "TypeError",
]
warns-extend-require-match-for = [
    "FutureWarning",
    "ImportWarning",
    "ResourceWarning",
    "RuntimeWarning",
    "SyntaxWarning",
]

[lint.flake8-tidy-imports]
ban-relative-imports = "all"

[lint.flake8-tidy-imports.banned-api]
"cgi" = { msg = "Removed by PEP 594; use urllib.parse, email, or a web framework." }
"cgitb" = { msg = "Removed by PEP 594; use traceback or framework error handling." }
"crypt" = { msg = "Removed by PEP 594; use a maintained password-hashing library." }
"imghdr" = { msg = "Removed by PEP 594; use Pillow or a maintained file-type library." }
"mailcap" = { msg = "Removed by PEP 594; use a maintained MIME-handling library." }
"nntplib" = { msg = "Removed by PEP 594; use a maintained NNTP client." }
"nis" = { msg = "Removed by PEP 594; use a maintained identity provider client." }
"ossaudiodev" = { msg = "Removed by PEP 594; use a maintained audio library." }
"pipes" = { msg = "Removed by PEP 594; use subprocess with argument lists." }
"sndhdr" = { msg = "Removed by PEP 594; use a maintained media-type library." }
"spwd" = { msg = "Removed by PEP 594; use a supported identity API." }
"sunau" = { msg = "Removed by PEP 594; use a maintained audio library." }
"telnetlib" = { msg = "Removed and insecure; use an encrypted SSH client." }
"uu" = { msg = "Removed by PEP 594; use base64 instead." }
"xdrlib" = { msg = "Removed by PEP 594; use a maintained serialization library." }
"distutils" = { msg = "Removed from Python; use packaging, setuptools, or sysconfig." }
"imp" = { msg = "Deprecated; use importlib instead." }
"mock" = { msg = "Use the standard-library unittest.mock module." }
"pkg_resources" = { msg = "Deprecated; use importlib.metadata/resources and packaging." }
"pytz" = { msg = "Use the standard-library zoneinfo module." }
"ftplib" = { msg = "FTP is unencrypted; use an SFTP or HTTPS client." }

[lint.flake8-type-checking]
strict = true
quote-annotations = false
# FastMCP resolves component signatures at registration, so their annotation imports stay at runtime.
runtime-evaluated-decorators = ["fastmcp.tools.tool", "fastmcp.resources.resource", "fastmcp.prompts.prompt"]

[lint.flake8-unused-arguments]
ignore-variadic-names = false

[lint.isort]
case-sensitive = true
combine-as-imports = true
default-section = "third-party"
force-sort-within-sections = false
lines-between-types = 0
detect-same-package = true
known-first-party = ["opendart", "opendart_mcp", "tests"]
order-by-type = true
required-imports = ["from __future__ import annotations"]
relative-imports-order = "closest-to-furthest"
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
split-on-trailing-comma = true

[lint.mccabe]
max-complexity = 10

[lint.pycodestyle]
ignore-overlong-task-comments = false
max-doc-length = 100

[lint.pydocstyle]
convention = "google"
ignore-var-parameters = false

[lint.pylint]
max-args = 6
max-positional-args = 3
max-bool-expr = 3
max-branches = 6
max-locals = 5
max-nested-blocks = 5
max-public-methods = 8
max-returns = 4
max-statements = 20
max-statements-in-try = 5


[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
nested-string-quote-style = "preferred"
skip-magic-trailing-comma = false
docstring-code-format = true
docstring-code-line-length = "dynamic"
preview = false
