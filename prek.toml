#:schema https://www.schemastore.org/prek.json

minimum_prek_version = "0.4.13"
fail_fast = false
default_stages = ["pre-commit"]
default_install_hook_types = ["pre-commit", "commit-msg", "pre-merge-commit", "pre-push"]
orphan = false

[exclude]
glob = [
    ".cache/**",
    ".venv/**",
    "build/**",
    "dist/**",
    "archive/**",
    "node_modules/**",
    "vendor/**",
    "**/generated/**",
]

[default_language_version]
python = "3.14"
mise = "default"
# node = "default"

[default_env]
PYTHONUTF8 = "1"
PYTHONUNBUFFERED = "1"
UV_NO_PROGRESS = "1"
UV_LOCKED = "1"

[priorities]
normalize_encoding = 0
normalize_line_endings = 10
normalize_structured = 15
normalize_whitespace = 20
normalize_eof = 30
integrity = 40
syntax = 45
security_fix = 47
security = 48
policy = 48
analyze = 50
typecheck = 60
quality = 70
test = 80
commit_message = 80

[update]
cooldown_days = 7
freeze = true
exclude_tags = ["*-{alpha,beta,rc}*"]

# Fast native checks need no additional runtime or package installation.
[[repos]]
repo = "builtin"

[[repos.hooks]]
id = "fix-byte-order-marker"
types = ["text"]
# Vendored conventions are maintained in their upstream repository.
exclude = '^\.agents/plugins/python-conventions/'
groups = ["builtin", "format", "fast", "ci"]
priority = "normalize_encoding"

[[repos.hooks]]
id = "mixed-line-ending"
args = ["--fix=lf"]
types = ["text"]
# Vendored conventions are maintained in their upstream repository.
exclude = '^\.agents/plugins/python-conventions/'
groups = ["builtin", "format", "fast", "ci"]
priority = "normalize_line_endings"

[[repos.hooks]]
id = "pretty-format-json"
args = ["--autofix", "--indent=2", "--no-ensure-ascii", "--no-sort-keys"]
types = ["json"]
# Vendored conventions are maintained in their upstream repository.
exclude = '^\.agents/plugins/python-conventions/'
groups = ["builtin", "json", "format", "fast", "ci"]
priority = "normalize_structured"

[[repos.hooks]]
id = "trailing-whitespace"
args = ["--markdown-linebreak-ext=md", "--markdown-linebreak-ext=mdx"]
types = ["text"]
# Vendored conventions are maintained in their upstream repository.
exclude = '^\.agents/plugins/python-conventions/'
groups = ["builtin", "format", "fast", "ci"]
priority = "normalize_whitespace"

[[repos.hooks]]
id = "end-of-file-fixer"
types = ["text"]
# Vendored conventions are maintained in their upstream repository.
exclude = '^\.agents/plugins/python-conventions/'
groups = ["builtin", "format", "fast", "ci"]
priority = "normalize_eof"

[[repos.hooks]]
id = "check-added-large-files"
args = ["--maxkb=500", "--enforce-all"]
types = ["file"]
stages = ["pre-commit", "pre-push"]
# Reviewed upstream catalog and generated lockfile; other checks cover their contents.
exclude = '^(api_reference/sources/catalog\.json|uv\.lock)$'
groups = ["builtin", "validate", "fast", "ci"]
priority = "integrity"

[[repos.hooks]]
id = "check-case-conflict"
types = ["file"]
stages = ["pre-commit", "pre-merge-commit"]
groups = ["builtin", "validate", "fast", "ci"]
priority = "integrity"

[[repos.hooks]]
id = "check-illegal-windows-names"
types = ["file"]
groups = ["builtin", "validate", "fast", "ci"]
priority = "integrity"

[[repos.hooks]]
id = "check-symlinks"
types = ["symlink"]
stages = ["pre-commit", "pre-merge-commit"]
groups = ["builtin", "validate", "fast", "ci"]
priority = "integrity"

[[repos.hooks]]
id = "destroyed-symlinks"
types = ["file"]
stages = ["pre-commit", "pre-merge-commit"]
groups = ["builtin", "validate", "fast", "ci"]
priority = "integrity"

[[repos.hooks]]
id = "check-executables-have-shebangs"
types = ["text", "executable"]
groups = ["builtin", "validate", "fast", "ci"]
priority = "integrity"

[[repos.hooks]]
id = "check-shebang-scripts-are-executable"
types = ["text"]
# Vendored conventions are maintained in their upstream repository.
exclude = '^\.agents/plugins/python-conventions/'
groups = ["builtin", "validate", "fast", "ci"]
priority = "integrity"

[[repos.hooks]]
id = "check-merge-conflict"
args = ["--assume-in-merge"]
types = ["text"]
stages = ["pre-commit", "pre-merge-commit", "pre-push"]
groups = ["builtin", "validate", "fast", "ci"]
priority = "syntax"

[[repos.hooks]]
id = "check-json"
types = ["json"]
stages = ["pre-commit", "pre-merge-commit"]
groups = ["builtin", "validate", "fast", "ci"]
priority = "syntax"

[[repos.hooks]]
id = "check-json5"
# Prek 0.4 does not identify .jsonc; include the Markdownlint configuration.
files = '\.json[5c]$'
types = ["text"]
stages = ["pre-commit", "pre-merge-commit"]
groups = ["builtin", "validate", "fast", "ci"]
priority = "syntax"

[[repos.hooks]]
id = "check-toml"
types = ["toml"]
stages = ["pre-commit", "pre-merge-commit"]
groups = ["builtin", "validate", "fast", "ci"]
priority = "syntax"

[[repos.hooks]]
id = "check-yaml"
args = ["--allow-multiple-documents"]
types = ["yaml"]
stages = ["pre-commit", "pre-merge-commit"]
groups = ["builtin", "validate", "fast", "ci"]
priority = "syntax"

[[repos.hooks]]
id = "check-xml"
types = ["xml"]
stages = ["pre-commit", "pre-merge-commit"]
groups = ["builtin", "validate", "fast", "ci"]
priority = "syntax"

[[repos.hooks]]
id = "check-vcs-permalinks"
types = ["text"]
# Vendored conventions are maintained in their upstream repository.
exclude = '^\.agents/plugins/python-conventions/'
groups = ["builtin", "validate", "fast", "ci"]
priority = "syntax"

[[repos.hooks]]
id = "detect-private-key"
types = ["text"]
stages = ["pre-commit", "pre-push"]
groups = ["builtin", "security", "fast", "ci"]
priority = "security"

[[repos.hooks]]
id = "no-commit-to-branch"
args = ["--branch", "main"]
# Enforce local branch policy; CI uses detached checkouts and main pushes.
always_run = true
pass_filenames = false
groups = ["builtin", "policy", "fast"]
priority = "policy"

[[repos.hooks]]
id = "forbid-new-submodules"
types = ["directory"]
stages = ["pre-commit", "pre-push"]
groups = ["builtin", "security", "fast", "ci"]
priority = "security"

[[repos]]
repo = "https://github.com/hadolint/hadolint"
rev = "v2.15.1"

[[repos.hooks]]
id = "hadolint-docker"
name = "Hadolint Dockerfile lint"
description = "Checks Dockerfiles for correctness and best practices using the repository's Hadolint configuration."
entry = "ghcr.io/hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d hadolint"
types = ["dockerfile"]
always_run = false
pass_filenames = true
groups = ["docker", "lint", "slow", "ci"]
# Starting Docker, and pulling the image on first use, is too slow for every commit.
stages = ["pre-push"]
require_serial = false
priority = "analyze"
log_file = ".prek-hadolint.log"

# Keep the hook version aligned with ruff.toml and the quality dependency group.
[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.17.1"

[[repos.hooks]]
id = "ruff-check"
name = "Ruff lint"
description = "Checks Python, notebooks, Markdown code blocks, and pyproject files with Ruff."
entry = "ruff check"
types_or = ["python", "pyi", "jupyter", "markdown", "pyproject"]
always_run = false
pass_filenames = true
groups = ["python", "lint", "fast", "ci"]
stages = ["pre-commit", "pre-merge-commit"]
require_serial = true
priority = "analyze"
log_file = ".prek-ruff-check.log"

[[repos.hooks]]
id = "ruff-format"
name = "Ruff format check"
description = "Checks Python, notebooks, and Markdown code blocks against Ruff formatting."
entry = "ruff format"
args = ["--check"]
types_or = ["python", "pyi", "jupyter", "markdown"]
always_run = false
pass_filenames = true
groups = ["python", "format-check", "fast", "ci"]
stages = ["pre-commit", "pre-merge-commit"]
require_serial = true
priority = "analyze"
log_file = ".prek-ruff-format.log"

[[repos]]
repo = "https://github.com/lycheeverse/lychee.git"
rev = "lychee-v0.24.2"

[[repos.hooks]]
id = "lychee"
name = "Lychee documentation links"
description = "Checks links in the project's Markdown documentation."
args = ["LYCHEE_VERSION=0.24.2", "--config=lychee.toml", "--no-progress"]
types = ["markdown"]
exclude = '^\.agents/plugins/python-conventions/'
pass_filenames = true
groups = ["links", "validate", "slow", "ci"]
stages = ["pre-push"]
require_serial = true
priority = "analyze"
log_file = ".prek-lychee.log"

# Install the locked workspace and contract dependencies with `just sync` first.
# --no-sync keeps concurrent hooks from modifying their shared environment.
[[repos]]
repo = "local"

[[repos.hooks]]
id = "commitizen"
name = "Commitizen commit message"
entry = "uv run --locked --no-progress --no-sync cz --config cz.toml check"
args = ["--allow-abort", "--commit-msg-file"]
language = "system"
pass_filenames = true
groups = ["commit-message"]
stages = ["commit-msg"]
priority = "commit_message"

[[repos.hooks]]
id = "zizmor"
name = "Zizmor GitHub Actions security"
entry = "uv run --locked --no-progress --no-sync zizmor"
args = ["--config=zizmor.yaml", "--no-progress", "--strict-collection", "--persona=pedantic", ".github"]
language = "system"
files = '^(\.github/.*\.ya?ml|zizmor\.yaml)$'
pass_filenames = false
groups = ["github-actions", "security", "fast", "ci"]
stages = ["pre-commit", "pre-merge-commit"]
require_serial = true
priority = "security"

[[repos.hooks]]
id = "actionlint"
name = "Actionlint GitHub Actions workflows"
description = "Checks workflow syntax, expressions, and run scripts with ShellCheck."
entry = "uv run --locked --no-progress --no-sync actionlint"
args = ["-no-color", "-pyflakes="]
language = "system"
files = '^\.github/workflows/.*\.ya?ml$'
pass_filenames = true
groups = ["github-actions", "lint", "fast", "ci"]
stages = ["pre-commit", "pre-merge-commit"]
require_serial = true
priority = "analyze"
log_file = ".prek-actionlint.log"

[[repos.hooks]]
id = "pip-audit"
name = "Pip-audit locked workspace dependencies"
entry = "uv run --locked --no-progress --no-sync bash scripts/pip_audit.sh"
args = ["--cache-dir=.cache/pip-audit", "--strict", "--aliases=on", "--progress-spinner=off"]
language = "system"
# Audit when locked dependencies change; scheduled CI catches newly published advisories.
files = { glob = ["uv.lock", "scripts/pip_audit.sh", "prek.toml"] }
pass_filenames = false
groups = ["python", "dependencies", "security", "slow", "ci"]
stages = ["pre-push"]
require_serial = true
priority = "security"

[[repos.hooks]]
id = "betterleaks"
name = "Betterleaks staged secrets"
entry = "bash scripts/betterleaks.sh git"
args = ["--config=betterleaks.toml", "--pre-commit", "--redact", "--staged"]
language = "system"
always_run = true
pass_filenames = false
groups = ["secrets", "security", "fast"]
stages = ["pre-commit"]
require_serial = true
priority = "security"
log_file = ".prek-betterleaks.log"

[[repos.hooks]]
id = "markdownlint-cli2"
name = "Markdownlint"
entry = "npx --yes --package=markdownlint-cli2@0.23.2 markdownlint-cli2 --config .markdownlint-cli2.jsonc"
language = "system"
types = ["markdown"]
exclude = '^\.agents/plugins/python-conventions/'
groups = ["markdown", "lint", "fast", "ci"]
stages = ["pre-commit", "pre-merge-commit"]
require_serial = true
# Separate from Taplo's initial npm installation into the shared cache.
priority = "quality"
log_file = ".prek-markdownlint-cli2.log"

[[repos.hooks]]
id = "taplo-format"
name = "Taplo format (check)"
description = "Checks TOML formatting using the repository's Taplo configuration."
# Invoke npm through PATH so CI's Safe Chain wrapper protects installation.
entry = "npx --yes --package=@taplo/cli@0.7.0 taplo format --check --config taplo.toml"
language = "system"
types = ["toml"]
# uv generates its lockfile layout.
exclude = '^uv\.lock$'
pass_filenames = true
groups = ["toml", "format-check", "fast", "ci"]
stages = ["pre-commit", "pre-merge-commit"]
require_serial = true
priority = "normalize_structured"
log_file = ".prek-taplo-format.log"

[[repos.hooks]]
id = "taplo-lint"
name = "Taplo lint"
description = "Checks TOML syntax and available schemas with Taplo."
entry = "npx --yes --package=@taplo/cli@0.7.0 taplo lint --config taplo.toml"
language = "system"
types = ["toml"]
exclude = '^uv\.lock$'
pass_filenames = true
groups = ["toml", "lint", "slow", "ci"]
# Schema validation fetches remote schemas, so keep network access out of commits.
stages = ["pre-push"]
require_serial = true
priority = "analyze"
log_file = ".prek-taplo-lint.log"

[[repos.hooks]]
id = "yamllint"
name = "Yamllint"
description = "Checks handwritten YAML with the repository's style and syntax policy."
entry = "uv run --locked --no-progress --no-sync yamllint --strict --config-file .yamllint.yaml"
language = "system"
types = ["yaml"]
pass_filenames = true
groups = ["yaml", "lint", "fast", "ci"]
stages = ["pre-commit", "pre-merge-commit"]
priority = "analyze"
log_file = ".prek-yamllint.log"

[[repos.hooks]]
id = "shellcheck"
name = "ShellCheck"
description = "Checks shell scripts for portability and correctness."
entry = "uv run --locked --no-progress --no-sync shellcheck"
language = "system"
types = ["shell"]
exclude = '^\.agents/plugins/python-conventions/'
pass_filenames = true
groups = ["shell", "lint", "fast", "ci"]
stages = ["pre-commit", "pre-merge-commit"]
priority = "analyze"
log_file = ".prek-shellcheck.log"

[[repos.hooks]]
id = "shfmt"
name = "Shfmt format (check)"
description = "Checks shell formatting against the repository's EditorConfig settings."
entry = "uv run --locked --no-progress --no-sync shfmt"
args = ["--diff"]
language = "system"
types = ["shell"]
exclude = '^\.agents/plugins/python-conventions/'
pass_filenames = true
groups = ["shell", "format-check", "fast", "ci"]
stages = ["pre-commit", "pre-merge-commit"]
priority = "normalize_structured"
log_file = ".prek-shfmt.log"

[[repos.hooks]]
id = "renovate-config"
name = "Renovate configuration"
description = "Validates renovate.json with Renovate's strict validator."
# Renovate needs Node.js 24 and validates its own configuration on every run, so CI skips this.
entry = "npx --yes --package=renovate@44.181.0 renovate-config-validator --strict"
language = "system"
files = '^renovate\.json$'
pass_filenames = false
groups = ["renovate", "validate", "slow"]
stages = ["pre-commit", "pre-merge-commit"]
require_serial = true
priority = "analyze"
log_file = ".prek-renovate-config.log"

[[repos.hooks]]
id = "typos"
name = "Typos spell check"
description = "Checks spelling while respecting generated files and documented vendor identifiers."
entry = "uv run --locked --no-progress --no-sync typos"
args = ["--force-exclude", "--config", "typos.toml"]
language = "system"
types = ["text"]
pass_filenames = true
groups = ["spelling", "lint", "fast", "ci"]
stages = ["pre-commit", "pre-merge-commit"]
priority = "analyze"
log_file = ".prek-typos.log"

[[repos.hooks]]
id = "loq"
name = "Loq file-size limits"
description = "Enforces line limits for handwritten files, with explicit legacy baselines."
entry = "uv run --locked --no-progress --no-sync loq check"
language = "system"
# Check the changed files on each commit; CI checks every tracked file.
types = ["text"]
groups = ["quality", "fast", "ci"]
stages = ["pre-commit", "pre-merge-commit"]
priority = "quality"
log_file = ".prek-loq.log"

# Path-gated hooks run only when commits or pushes change their inputs.
[[repos.hooks]]
id = "pyrefly"
name = "Pyrefly type checking"
description = "Type-checks both Python package source trees with strict Pyrefly settings."
entry = "uv run --locked --no-progress --no-sync pyrefly check --config pyrefly.toml"
language = "system"
# A whole-project check takes about a second, so it runs with each commit.
files = { glob = ["packages/{sdk,mcp}/{src/**,pyproject.toml}", "{pyrefly,pyproject,prek}.toml", "uv.lock"] }
pass_filenames = false
groups = ["python", "typecheck", "fast", "ci"]
stages = ["pre-commit", "pre-merge-commit"]
require_serial = true
priority = "typecheck"
log_file = ".prek-pyrefly.log"

[[repos.hooks]]
id = "mcp-components"
name = "MCP component lock"
description = "Checks MCP component versions, definition fingerprints, and the tool token budget against the lock."
entry = "uv run --locked --no-progress --no-sync python scripts/check_mcp_components.py"
language = "system"
# Building the server's manifest offline takes about a second, so it runs with each commit.
files = { glob = [
    "packages/mcp/{src/**,pyproject.toml,components.lock.json}",
    "scripts/check_mcp_components.py",
    "{prek.toml,uv.lock}",
] }
pass_filenames = false
groups = ["python", "mcp", "fast", "ci"]
stages = ["pre-commit", "pre-merge-commit"]
require_serial = true
priority = "quality"
log_file = ".prek-mcp-components.log"

[[repos.hooks]]
id = "mcp-registry"
name = "MCP registry freshness"
description = "Checks that the generated MCP service registry matches the API catalog and the SDK naming rules."
entry = "uv run --locked --no-progress --no-sync python scripts/generate_mcp_registry.py --check"
language = "system"
# Generation takes about five seconds, so it runs before pushes that change its inputs.
files = { glob = [
    "api_reference/{sources/catalog.json,paths/**}",
    "scripts/generate_{mcp_registry,sdk}.py",
    "packages/mcp/src/opendart_mcp/registry/_generated.py",
    # The generator formats its output with the locked Ruff and the repository configuration.
    "{ruff,prek}.toml",
    "uv.lock",
] }
pass_filenames = false
groups = ["python", "mcp", "slow", "ci"]
stages = ["pre-push"]
require_serial = true
priority = "quality"
log_file = ".prek-mcp-registry.log"

[[repos.hooks]]
id = "pytest-sdk"
name = "Pytest (SDK)"
description = "Runs offline SDK tests and writes isolated coverage and HTML reports."
entry = "uv run --locked --no-progress --no-sync pytest packages/sdk/tests --cov-config=packages/sdk/.coveragerc.toml --html=.cache/pytest/sdk-report.html -o cache_dir=.cache/pytest/sdk"
language = "system"
files = { glob = [
    "packages/sdk/{src/**,tests/**,pyproject.toml,.coveragerc.toml}",
    # SDK contract tests exercise every service against the reference documents.
    "api_reference/**/*.{yaml,json}",
    "{pyproject.toml,pytest.toml,prek.toml,uv.lock}",
] }
pass_filenames = false
groups = ["python", "test", "slow", "ci"]
stages = ["pre-push"]
require_serial = true
priority = "test"
log_file = ".prek-pytest-sdk.log"

[[repos.hooks]]
id = "pytest-mcp"
name = "Pytest (MCP)"
description = "Runs offline MCP tests and writes isolated coverage and HTML reports."
entry = "uv run --locked --no-progress --no-sync pytest packages/mcp/tests --cov-config=packages/mcp/.coveragerc.toml --html=.cache/pytest/mcp-report.html -o cache_dir=.cache/pytest/mcp"
language = "system"
files = { glob = [
    "packages/mcp/{src/**,tests/**,pyproject.toml,.coveragerc.toml}",
    # MCP runs on the installed SDK.
    "packages/sdk/{src/**,pyproject.toml}",
    # Registry tests run the generator on its inputs and parse the component design;
    # manifest tests run the component lock script.
    "packages/mcp/docs/COMPONENT_DESIGN.md",
    "scripts/{check_mcp_components,generate_mcp_registry,generate_sdk}.py",
    "api_reference/{sources/catalog.json,paths/**}",
    "{pyproject.toml,pytest.toml,prek.toml,uv.lock}",
] }
pass_filenames = false
groups = ["python", "test", "slow", "ci"]
stages = ["pre-push"]
require_serial = true
priority = "test"
log_file = ".prek-pytest-mcp.log"

[[repos.hooks]]
id = "mcp-conformance"
name = "MCP conformance"
description = "Runs the official MCP conformance suite in both protocol eras against an isolated server without an API key."
entry = "uv run --locked --no-progress --no-sync python scripts/check_mcp_conformance.py"
language = "system"
# Starting a server and running the pinned suite takes a few seconds once npx has cached
# it, so it runs before pushes that change the server, its SDK, the baseline, or the runner.
files = { glob = [
    "packages/mcp/{src/**,pyproject.toml,conformance-baseline.yaml}",
    "packages/sdk/{src/**,pyproject.toml}",
    "scripts/check_mcp_conformance.py",
    "{prek.toml,uv.lock}",
] }
pass_filenames = false
groups = ["python", "mcp", "slow", "ci"]
stages = ["pre-push"]
require_serial = true
priority = "test"
log_file = ".prek-mcp-conformance.log"

[[repos.hooks]]
id = "pytest-ci"
name = "Pytest (CI selection)"
description = "Tests which CI checks each changed path and event selects."
entry = "uv run --locked --no-progress --no-sync pytest tests/ci --no-cov --html=.cache/pytest/ci-report.html -o cache_dir=.cache/pytest/ci"
language = "system"
files = { glob = [
    ".github/{ci-paths.toml,scripts/select_components.py}",
    "tests/ci/**",
    "{pytest,prek}.toml",
    "uv.lock",
] }
pass_filenames = false
groups = ["python", "test", "fast", "ci"]
stages = ["pre-push"]
require_serial = true
priority = "test"
log_file = ".prek-pytest-ci.log"

[[repos.hooks]]
id = "pytest-contracts"
name = "Pytest (offline contracts)"
description = "Tests API reference tooling and contract validation without live API calls."
entry = "uv run --locked --no-progress --no-sync pytest tests/contracts --no-cov --html=.cache/pytest/contracts-report.html -o cache_dir=.cache/pytest/contracts"
language = "system"
files = { glob = [
    "tests/{__init__.py,contracts/**}",
    "scripts/api_reference/*.py",
    "api_reference/**/*.{yaml,json}",
    "{pyproject.toml,pytest.toml,prek.toml,uv.lock}",
] }
pass_filenames = false
groups = ["python", "test", "slow", "ci"]
stages = ["pre-push"]
require_serial = true
priority = "test"
log_file = ".prek-pytest-contracts.log"
