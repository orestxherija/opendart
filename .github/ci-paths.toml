# A changed file selects a filter when the last pattern it matches has no leading "!".
# "include" puts another filter's patterns first. select_components.py applies the event policy.

# Routing and shared tooling; a change reruns every component.
[shared]
paths = [
    "pyproject.toml",
    "uv.toml",
    "uv.lock",
    ".python-version",
    "justfile",
    ".github/justfile",
    ".github/ci-paths.toml",
    ".github/workflows/ci.yml",
    ".github/actions/setup/**",
    ".github/scripts/install_safe_chain.sh",
    ".github/scripts/select_components.py",
]

[python]
paths = ["ruff.toml", "pytest.toml"]

# Zizmor and pip-audit, plus the CI tests of change selection and shared tool pins.
[audit]
paths = [
    "prek.toml",
    "pytest.toml",
    "uv.lock",
    "scripts/pip_audit.sh",
    ".github/justfile",
    ".github/ci-paths.toml",
    ".github/actions/**",
    ".github/scripts/**",
    ".github/workflows/**",
    "packages/mcp/Dockerfile",
    "tests/ci/**",
]

[release]
include = ["shared", "python"]
paths = [
    ".github/workflows/check-release.yml",
    "cz.toml",
    "packages/sdk/pyproject.toml",
    "packages/mcp/pyproject.toml",
    "scripts/check_release.py",
    "scripts/smoke_distributions.py",
    "scripts/smoke_installed.py",
    "tests/release/**",
]

# Package tests and docs cannot change whether the distributions build or install.
[distributions]
include = ["shared"]
paths = [
    ".github/workflows/check-release.yml",
    "cz.toml",
    "packages/sdk/**",
    "packages/mcp/**",
    "!packages/*/tests/**",
    "!packages/*/docs/**",
    "scripts/check_release.py",
    "scripts/smoke_distributions.py",
    "scripts/smoke_installed.py",
]

# The API contract files generate the SDK.
[sdk]
include = ["shared", "python"]
paths = [
    "prek.toml",
    "pyrefly.toml",
    "codecov.yml",
    ".github/workflows/check-sdk.yml",
    "packages/sdk/**",
    "!packages/sdk/docs/**",
    "scripts/generate_sdk.py",
    "api_reference/openapi.yaml",
    "api_reference/parameters.yaml",
    "api_reference/examples.yaml",
    "api_reference/paths/**",
    "api_reference/schemas/**",
    "api_reference/sources/**",
    "scripts/api_reference/build.py",
    "scripts/api_reference/snapshot.py",
]

# A registry test parses COMPONENT_DESIGN.md; MCP runs on the installed SDK.
[mcp]
include = ["shared", "python"]
paths = [
    "prek.toml",
    "pyrefly.toml",
    "codecov.yml",
    ".hadolint.yaml",
    ".github/workflows/check-mcp.yml",
    "packages/mcp/**",
    "!packages/mcp/docs/**",
    "packages/mcp/docs/COMPONENT_DESIGN.md",
    "scripts/check_mcp.py",
    "scripts/check_mcp_runtime.py",
    "scripts/check_mcp_components.py",
    "scripts/check_mcp_conformance.py",
    "scripts/generate_mcp_registry.py",
    "scripts/generate_sdk.py",
    "api_reference/sources/catalog.json",
    "api_reference/paths/**",
    "packages/sdk/src/**",
    "packages/sdk/pyproject.toml",
    "packages/sdk/README.md",
]

# The image's build inputs mirror the .dockerignore allowlist, without READMEs.
[image]
include = ["shared"]
paths = [
    ".dockerignore",
    ".github/workflows/check-mcp-image.yml",
    ".github/actions/image-metadata/**",
    ".github/actions/scan-container/**",
    ".github/scripts/check_mcp_container.sh",
    ".github/scripts/verify_dhi.sh",
    "packages/mcp/Dockerfile",
    "packages/mcp/docker-compose.yml",
    "packages/mcp/compose.secrets.yml",
    "packages/mcp/pyproject.toml",
    "packages/mcp/src/**",
    "packages/mcp/components.lock.json",
    "packages/sdk/pyproject.toml",
    "packages/sdk/src/**",
    "scripts/check_mcp.py",
    "scripts/check_mcp_runtime.py",
]

# Publishing runs on main only, so a pull request image check cannot exercise these.
[publisher]
paths = [
    ".github/workflows/publish-mcp-image.yml",
    ".github/actions/verify-image-signature/**",
    ".github/scripts/promote_image.sh",
]

[base_images]
paths = ["packages/mcp/Dockerfile", ".github/scripts/verify_dhi.sh", ".github/workflows/check-mcp-image.yml"]

# Package source cannot change the image's vulnerabilities; the daily scan covers new advisories.
[vulnerabilities]
paths = [
    ".dockerignore",
    "packages/mcp/Dockerfile",
    "uv.lock",
    ".github/actions/scan-container/**",
    ".github/workflows/check-mcp-image.yml",
]

[reference]
include = ["shared", "python"]
paths = [
    "prek.toml",
    ".github/workflows/check-reference.yml",
    "api_reference/**",
    "!api_reference/*.md",
    "scripts/api_reference/**",
    "tests/__init__.py",
    "tests/contracts/**",
]

# Operations that the live contract tests check after a push to main.
[api]
paths = [
    "api_reference/openapi.yaml",
    "api_reference/parameters.yaml",
    "api_reference/examples.yaml",
    "api_reference/paths/**",
    "api_reference/schemas/**",
    ".github/workflows/test-live-contracts.yml",
]
