version: 2

registries:
  docker-hardened-images:
    type: docker-registry
    url: https://dhi.io
    username: ${{ secrets.DHI_USERNAME }}
    password: ${{ secrets.DHI_TOKEN }}

updates:
  # The root lockfile covers both SDK and MCP workspace members.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 2
    groups:
      # fastmcp-tasks patches mcp internals, so FastMCP and the MCP SDK upgrade together.
      fastmcp-and-mcp:
        patterns:
          - "fastmcp"
          - "fastmcp-*"
          - "mcp"
          - "mcp-types"

  - package-ecosystem: "pip"
    directory: "/scripts/api_reference"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 2

  - package-ecosystem: "npm"
    directory: "/scripts/api_reference"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 2

  - package-ecosystem: "docker"
    directory: "/packages/mcp"
    registries:
      - docker-hardened-images
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 2
    groups:
      dhi-python:
        patterns:
          - "dhi.io/python"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 2
