version: 2

updates:
  # The root lockfile covers both SDK and MCP workspace members.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/api_reference"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/api_reference"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/packages/mcp"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
