name: SDK checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sdk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.20"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Set up Safe Chain
        uses: ./.github/actions/setup-safe-chain
      - name: Install Python dependencies
        run: |
          uv safe-chain-verify
          uv sync --locked --all-packages
      - run: uv run --no-sync ruff check packages scripts
      - run: uv run --no-sync ruff format --check packages scripts
      - run: uv run --no-sync mypy
      - run: uv run --no-sync python scripts/generate_sdk.py --check
      - run: uv run --no-sync python api_reference/scripts/check.py
      - run: uv run --no-sync pytest
      - run: uv build --package opendart-sdk
      - run: uv build --package opendart-mcp
