name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Only supersede runs for the same PR. Each main push must keep its own
  # comparison, even when a later push changes a different component.
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sdk: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.sdk == 'true' }}
      mcp: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.mcp == 'true' }}
      reference: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.reference == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fetch push comparison history before checkout removes credentials.
          fetch-depth: 0
          persist-credentials: false
      - name: Find affected components
        if: github.event_name != 'workflow_dispatch'
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # On pushes, compare the full push with its previous commit. PRs use
          # the complete PR diff through the GitHub API instead.
          base: ${{ github.event_name == 'push' && github.ref || '' }}
          filters: .github/ci-paths.yml

  sdk:
    name: SDK
    needs: changes
    if: needs.changes.outputs.sdk == 'true'
    uses: ./.github/workflows/sdk.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  mcp:
    name: MCP
    needs: changes
    if: needs.changes.outputs.mcp == 'true'
    uses: ./.github/workflows/mcp.yml

  reference:
    name: API reference
    needs: changes
    if: needs.changes.outputs.reference == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml

  checks:
    name: CI checks
    if: always()
    needs: [changes, sdk, mcp, reference]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every selected component to pass
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os

          needs = json.loads(os.environ["NEEDS_JSON"])
          if needs["changes"]["result"] != "success":
              raise SystemExit("Change detection did not succeed")
          for component in ("sdk", "mcp", "reference"):
              selected = needs["changes"]["outputs"][component]
              if selected not in ("true", "false"):
                  raise SystemExit(f"Invalid change-detection output for {component}")
              expected = "success" if selected == "true" else "skipped"
              actual = needs[component]["result"]
              print(f"{component}: {actual} (expected {expected})")
              if actual != expected:
                  raise SystemExit(f"{component} did not complete as expected")
          PY
