name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    # Drafts skip the expensive checks; marking a draft ready runs them.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Only supersede runs for the same PR. Each main push must keep its own
  # comparison, even when a later push changes a different component.
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    # Light jobs use the cheaper single-CPU runner; it has Git and Python.
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # Read the complete PR diff for component selection.
    outputs:
      quality: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.quality == 'true' }}
      audit: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.audit == 'true' }}
      release: >-
        ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.release == 'true'
        || (!github.event.pull_request.draft && steps.filter.outputs.distributions == 'true') }}
      sdk: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.sdk == 'true' }}
      mcp: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.mcp == 'true' }}
      reference: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.reference == 'true' }}
      # Expensive builds run when their inputs change, except on draft PRs.
      distributions: >-
        ${{ github.event_name == 'workflow_dispatch'
        || (!github.event.pull_request.draft && steps.filter.outputs.distributions == 'true') }}
      container: >-
        ${{ github.event_name == 'workflow_dispatch'
        || (!github.event.pull_request.draft && steps.filter.outputs.container == 'true') }}
      base-images: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.base-images == 'true' }}
      vulnerabilities: >-
        ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.vulnerabilities == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fetch push comparison history before checkout removes credentials.
          fetch-depth: 0
          persist-credentials: false
      - name: Find affected components
        if: github.event_name != 'workflow_dispatch'
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # On pushes, compare the full push with its previous commit. PRs use
          # the complete PR diff through the GitHub API instead.
          base: ${{ github.event_name == 'push' && github.ref || '' }}
          filters: .github/ci-paths.yml
          # A leading ! excludes matching files from that filter.
          predicate-quantifier: some-with-excludes

  quality:
    name: Repository quality
    needs: changes
    if: needs.changes.outputs.quality == 'true'
    uses: ./.github/workflows/quality.yml
    with:
      audit: ${{ needs.changes.outputs.audit == 'true' }}

  release:
    name: Release
    needs: changes
    if: needs.changes.outputs.release == 'true'
    uses: ./.github/workflows/release.yml
    with:
      build: ${{ needs.changes.outputs.distributions == 'true' }}

  sdk:
    name: SDK
    needs: changes
    if: needs.changes.outputs.sdk == 'true'
    uses: ./.github/workflows/sdk.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  mcp:
    name: MCP
    needs: changes
    if: needs.changes.outputs.mcp == 'true'
    uses: ./.github/workflows/mcp.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  container:
    name: MCP image
    needs: changes
    if: needs.changes.outputs.container == 'true'
    uses: ./.github/workflows/mcp-image.yml
    with:
      verify-base-images: ${{ needs.changes.outputs.base-images == 'true' }}
      scan-vulnerabilities: ${{ needs.changes.outputs.vulnerabilities == 'true' }}
    secrets:
      DHI_USERNAME: ${{ secrets.DHI_USERNAME }}
      DHI_TOKEN: ${{ secrets.DHI_TOKEN }}

  reference:
    name: API reference
    needs: changes
    if: needs.changes.outputs.reference == 'true'
    permissions:
      contents: read
      pages: write # The called Pages workflow publishes the reference site.
      id-token: write # The Pages deployment authenticates with OIDC.
    uses: ./.github/workflows/pages.yml

  checks:
    name: CI checks
    if: always()
    needs: [changes, quality, release, sdk, mcp, container, reference]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Require every selected component to pass
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os

          needs = json.loads(os.environ["NEEDS_JSON"])
          if needs["changes"]["result"] != "success":
              raise SystemExit("Change detection did not succeed")
          for component in ("quality", "release", "sdk", "mcp", "container", "reference"):
              selected = needs["changes"]["outputs"][component]
              if selected not in ("true", "false"):
                  raise SystemExit(f"Invalid change-detection output for {component}")
              expected = "success" if selected == "true" else "skipped"
              actual = needs[component]["result"]
              print(f"{component}: {actual} (expected {expected})")
              if actual != expected:
                  raise SystemExit(f"{component} did not complete as expected")
          PY
