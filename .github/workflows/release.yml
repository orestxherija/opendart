name: Release artifacts

on:
  workflow_call:
    inputs:
      build:
        description: Build, validate, and smoke-test both packages' distributions.
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      build:
        description: Build, validate, and smoke-test both packages' distributions.
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release:
    name: Package versions and release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python and uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.5"
          python-version: "3.14"
          enable-cache: true
      - name: Set up Aikido Safe Chain
        uses: ./.github/actions/setup-safe-chain
      - name: Install release and test tools
        run: |
          uv safe-chain-verify
          uv sync --locked --all-packages
      - name: Check release tooling style
        run: |
          files=(scripts/check_release.py scripts/smoke_distributions.py scripts/smoke_installed.py tests/release)
          uv run --no-sync ruff check "${files[@]}"
          uv run --no-sync ruff format --check "${files[@]}"
      - name: Validate coordinated package versions
        run: uv run --no-sync python scripts/check_release.py
      - name: Test release validation
        run: >-
          uv run --no-sync pytest tests/release --no-cov
          --html=.cache/pytest/release-report.html -o cache_dir=.cache/pytest/release
      # CI builds when package files or release tooling change, except on drafts.
      - name: Build wheels and source distributions
        if: inputs.build
        run: uv build --all-packages --no-sources
      - name: Validate distribution metadata and readmes
        if: inputs.build
        run: |
          uv run --no-sync python scripts/check_release.py --dist dist
          uv run --no-sync twine check --strict dist/*
      - name: Smoke-test isolated wheel and source installations
        if: inputs.build
        # Keep Safe Chain on PATH for the script's child package installations.
        run: .venv/bin/python scripts/smoke_distributions.py
      - name: Upload release validation report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-validation-report
          path: .cache/pytest/release-report.html
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
