name: SDK checks

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sdk:
    name: Python 3.14
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.20"
          python-version: "3.14"
          enable-cache: true
      - name: Set up Aikido Safe Chain
        uses: ./.github/actions/setup-safe-chain
      - name: Install SDK and development dependencies
        run: |
          uv safe-chain-verify
          uv sync --locked --package opendart-workspace --package opendart-sdk
      - name: Lint SDK and generator
        run: uv run --no-sync ruff check packages/sdk scripts/generate_sdk.py
      - name: Check SDK and generator formatting
        run: uv run --no-sync ruff format --check packages/sdk scripts/generate_sdk.py
      - name: Check SDK types with Pyrefly
        run: uv run --no-sync pyrefly check --config pyrefly.toml packages/sdk/src
      - name: Check generated SDK files
        run: uv run --no-sync python scripts/generate_sdk.py --check
      - name: Run SDK tests
        run: uv run --no-sync prek run pytest-sdk --all-files --stage pre-push
      - name: Upload SDK test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-test-report
          path: .cache/pytest/sdk-report.html
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload SDK coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          disable_search: true
          fail_ci_if_error: true
          files: .cache/coverage/sdk.xml
          flags: sdk
          name: sdk-python-3.14
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Build SDK distributions
        run: uv build --package opendart-sdk
