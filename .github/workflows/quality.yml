name: Repository quality

on:
  workflow_call:
    inputs:
      audit:
        description: Audit workflows and locked Python dependencies.
        type: boolean
        default: true
      check-links:
        description: Also check external documentation links.
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      audit:
        description: Audit workflows and locked Python dependencies.
        type: boolean
        default: true
      check-links:
        description: Also check external documentation links.
        type: boolean
        default: true
  schedule:
    - cron: "23 8 * * 1"

permissions:
  contents: read

concurrency:
  # Preserve each push and scheduled audit; supersede only older runs for a PR.
  group: repository-quality-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# These jobs are network- or install-bound and need no Docker, so they use the
# cheaper single-CPU runner, which caps jobs at 15 minutes.
jobs:
  quality:
    name: File integrity, Ruff, Markdown, YAML, TOML, spelling, and file lengths
    if: github.event_name != 'schedule'
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python and uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.20"
          python-version: "3.14"
          enable-cache: true
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.3"
      - name: Set up Aikido Safe Chain
        uses: ./.github/actions/setup-safe-chain
      - name: Install quality tools
        run: |
          uv safe-chain-verify
          uv sync --locked --only-group hooks --only-group quality
          npm safe-chain-verify
          npx safe-chain-verify
      - name: Check built-in file and repository policies
        # Branch protection is a local commit policy; CI may use detached HEAD
        # or run on main after a merge. The remaining built-ins have group ci.
        run: .venv/bin/prek run --group builtin --require-group ci --all-files --stage pre-commit
      - name: Check Python and Markdown code with Ruff
        # Component workflows lint their own trees; this also covers docs and root scripts.
        run: |
          .venv/bin/ruff check
          .venv/bin/ruff format --check
      - name: Check Markdown, YAML, TOML, spelling, and file lengths
        run: .venv/bin/prek run markdownlint-cli2 yamllint taplo-format typos loq --all-files --stage pre-commit
      - name: Check TOML schemas
        # Local hooks validate schemas before pushes because this fetches remote schemas.
        run: .venv/bin/prek run taplo-lint --all-files --stage pre-push

  security:
    name: Workflow security and Python dependency audit
    # CI selects audits when workflows or the lockfile change; the schedule
    # catches advisories published for unchanged dependencies.
    if: github.event_name == 'schedule' || inputs.audit
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python and uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.20"
          python-version: "3.14"
          enable-cache: true
      - name: Set up Aikido Safe Chain
        uses: ./.github/actions/setup-safe-chain
      - name: Install security tools and hook runner
        run: |
          uv safe-chain-verify
          uv sync --locked --only-group hooks --only-group quality
      - name: Audit workflows, shared actions, and Dependabot
        env:
          GH_TOKEN: ${{ github.token }}
        run: .venv/bin/prek run zizmor --all-files --stage pre-commit
      - name: Audit all locked Python dependencies
        # Export all packages, extras, and groups without installing audited dependencies.
        run: .venv/bin/prek run pip-audit --all-files --stage pre-push

  secrets:
    name: Betterleaks Git history
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Check out complete Git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Include intermediate PR and push commits, even when a later commit
          # removes a secret. The merge checkout also retains PR ancestry.
          fetch-depth: 0
          persist-credentials: false
      - name: Scan all fetched Git history for secrets
        # Always redact findings and avoid retaining reports as artifacts.
        run: bash scripts/betterleaks.sh git --config=betterleaks.toml --redact --log-opts=--all

  links:
    name: Documentation links
    # External sites can be unavailable independently of a change. Audit them
    # weekly or on demand, without adding external link checks to PRs.
    if: github.event_name == 'schedule' || inputs.check-links
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python and uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.20"
          python-version: "3.14"
          enable-cache: true
      - name: Set up Aikido Safe Chain
        uses: ./.github/actions/setup-safe-chain
      - name: Install hook runner
        run: |
          uv safe-chain-verify
          uv sync --locked --only-group hooks
      - name: Check documentation links
        # Verbose also writes successful hook output to its configured log file.
        run: .venv/bin/prek run lychee --all-files --stage pre-push --verbose
      - name: Upload link check report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation-link-report
          path: .prek-lychee.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
