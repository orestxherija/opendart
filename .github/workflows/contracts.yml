name: Live API contracts

# Every main push has its own changed-operation set and must finish its checks.
on: # zizmor: ignore[concurrency-limits]
  push:
    # The job also checks the default branch; this avoids skipped feature-branch runs.
    branches: ["main"]
    paths:
      - 'api_reference/openapi.yaml'
      - 'api_reference/parameters.yaml'
      - 'api_reference/examples.yaml'
      - 'api_reference/paths/**'
      - 'api_reference/schemas/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Changed OpenDART operations
    # Run after the merge/push, never against a PR or a feature branch's secrets.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # event.before covers the entire push, including multi-commit merges.
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.20'
          python-version: '3.14'
          enable-cache: true
      - name: Set up Aikido Safe Chain
        uses: ./.github/actions/setup-safe-chain
      - name: Install locked contract dependencies
        run: |
          uv safe-chain-verify
          uv sync --locked --only-group contracts
      - name: Select changed operations
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            uv run --no-sync python -m tests.contracts.selection \
              --head "$AFTER_SHA" --output contract-results/selection.json
          else
            uv run --no-sync python -m tests.contracts.selection \
              --base "$BEFORE_SHA" --head "$AFTER_SHA" \
              --output contract-results/selection.json
          fi
      - name: Check selected contracts with Schemathesis
        env:
          OPENDART_API__API_KEY: ${{ secrets.OPENDART_API_KEY }}
        run: |
          uv run --no-sync python -m tests.contracts.run \
            --selection contract-results/selection.json \
            --report contract-results/report.json
      - name: Upload selection and sanitized findings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: contract-findings-${{ github.sha }}
          path: contract-results/
          retention-days: 14
          if-no-files-found: warn
      - name: Summarize findings
        if: always()
        run: |
          if [ -f contract-results/report.md ]; then
            cat contract-results/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
