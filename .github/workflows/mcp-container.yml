name: MCP container

on:
  # CI calls this after a push to main that changes the image's inputs passes
  # every selected check.
  workflow_call:
    outputs:
      digest:
        description: Digest of the verified, signed, and promoted image
        value: ${{ jobs.publish.outputs.digest }}
    secrets:
      DHI_USERNAME:
        description: Docker ID used to pull Docker Hardened Images
        required: true
      DHI_TOKEN:
        description: Docker personal access token with read access to DHI
        required: true
  # Manual runs on the default branch republish its tip. Manual runs on a
  # release tag retry that release's promotion.
  workflow_dispatch:
  # A release tag promotes the verified image of the tagged main commit.
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  publish:
    name: Publish verified MCP image
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One publisher at a time, so the main tag check below sees the latest
    # promotion. A newer waiting run replaces an older waiting one.
    concurrency:
      group: mcp-container-publish
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write # Push and promote the verified MCP image in GHCR.
      id-token: write # Sign the image digest with keyless Cosign OIDC.
    outputs:
      digest: ${{ steps.candidate.outputs.digest }}
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/opendart-mcp
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Require the default branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Publish from $DEFAULT_BRANCH only; pull requests check images without pushing them."
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The main tag check compares commits in the default branch history.
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.5"
          python-version: "3.14"
          # Publishing must not restore caches populated by check workflows.
          enable-cache: false
      - name: Set up Aikido Safe Chain
        uses: ./.github/actions/setup-safe-chain
      - name: Install MCP client
        run: |
          uv safe-chain-verify
          uv sync --locked --package opendart-workspace --package opendart-mcp --no-dev --group hooks
      - name: Lint Dockerfile
        run: uv run --no-sync prek run hadolint-docker --all-files --stage pre-push
      - name: Validate Compose configuration
        run: docker compose -f packages/mcp/docker-compose.yml config --quiet
      - name: Log in to Docker Hardened Images
        env:
          DHI_USERNAME: ${{ secrets.DHI_USERNAME }}
          DHI_TOKEN: ${{ secrets.DHI_TOKEN }}
        run: |
          if [ -z "$DHI_USERNAME" ] || [ -z "$DHI_TOKEN" ]; then
            echo "::error::Set DHI_USERNAME and DHI_TOKEN repository secrets; see .github/README.md."
            exit 1
          fi
          printf '%s' "$DHI_TOKEN" | docker login dhi.io --username "$DHI_USERNAME" --password-stdin
      - name: Verify Docker Hardened Images
        uses: ./.github/actions/verify-dhi
        env:
          DOCKER_SCOUT_HUB_USER: ${{ secrets.DHI_USERNAME }}
          DOCKER_SCOUT_HUB_PASSWORD: ${{ secrets.DHI_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Read package version
        id: package
        run: |
          uv run --no-sync python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          import tomllib

          project = tomllib.loads(Path("packages/mcp/pyproject.toml").read_text())["project"]
          print(f"version={project['version']}")
          PY
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          # The promotion step adds main when that does not move it backwards.
          tags: type=sha,format=long
          labels: |
            org.opencontainers.image.title=OpenDART MCP
            org.opencontainers.image.description=OpenDART MCP server over local HTTP
            org.opencontainers.image.version=${{ steps.package.outputs.version }}
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build and push untagged candidate once
        id: candidate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packages/mcp/Dockerfile
          platforms: linux/amd64
          pull: true
          # Push by digest only: no tag refers to the candidate until it passes.
          tags: ${{ env.IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          # Build release candidates without restoring shared CI layers.
          no-cache: true
          provenance: mode=max
          sbom: true
      - name: Pull candidate by immutable digest
        env:
          IMAGE_DIGEST: ${{ steps.candidate.outputs.digest }}
        run: |
          docker pull "$IMAGE@$IMAGE_DIGEST"
      - name: Test exact candidate security and protocol
        uses: ./.github/actions/check-mcp-container
        with:
          image: ${{ env.IMAGE }}@${{ steps.candidate.outputs.digest }}
      - name: Scan exact candidate
        uses: ./.github/actions/scan-container
        with:
          image: ${{ env.IMAGE }}@${{ steps.candidate.outputs.digest }}
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: Sign and verify candidate digest
        env:
          IMAGE_DIGEST: ${{ steps.candidate.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE@$IMAGE_DIGEST"
          # Fulcio records this workflow's job_workflow_ref, not the calling
          # workflow in GITHUB_WORKFLOW_REF, so CI and manual runs on main sign
          # with the same identity.
          identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/mcp-container.yml@$GITHUB_REF"
          cosign verify "$IMAGE@$IMAGE_DIGEST" \
            --certificate-identity="$identity" \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com
      - name: Choose tags without moving main backwards
        id: tags
        env:
          SHA_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          tags="$SHA_TAGS"
          current=""
          if image=$(docker buildx imagetools inspect "$IMAGE:main" --format '{{json .Image}}' 2>/dev/null); then
            current=$(jq --raw-output 'if has("config") then . else .["linux/amd64"] end
              | .config.Labels["org.opencontainers.image.revision"] // empty' <<< "$image") || current=""
          fi
          # Promote main when it is new, unreadable, rewritten away, or an ancestor.
          if [ -z "$current" ] || ! git cat-file -e "$current^{commit}" 2>/dev/null \
            || git merge-base --is-ancestor "$current" "$GITHUB_SHA"; then
            tags+=$'\n'"$IMAGE:main"
          else
            echo "::notice::main already refers to newer commit $current; leaving it unchanged."
          fi
          {
            echo 'list<<TAGS'
            echo "$tags"
            echo 'TAGS'
          } >> "$GITHUB_OUTPUT"
      - name: Promote verified digest without rebuilding
        env:
          IMAGE_DIGEST: ${{ steps.candidate.outputs.digest }}
          IMAGE_TAGS: ${{ steps.tags.outputs.list }}
        run: |
          tag_arguments=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              tag_arguments+=(--tag "$tag")
            fi
          done <<< "$IMAGE_TAGS"
          docker buildx imagetools create --prefer-index=false \
            "${tag_arguments[@]}" "$IMAGE@$IMAGE_DIGEST"
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | \
                jq --exit-status --arg digest "$IMAGE_DIGEST" '.digest == $digest'
            fi
          done <<< "$IMAGE_TAGS"
          {
            printf 'Tested, scanned, signed, and promoted `%s`.\n\n' "$IMAGE@$IMAGE_DIGEST"
            printf 'Tags:\n\n'
            sed -e '/^$/d' -e 's/.*/- `&`/' <<< "$IMAGE_TAGS"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
      - name: Log out of Docker Hardened Images
        if: always()
        run: docker logout dhi.io

  release:
    name: Promote release image
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: mcp-container-release-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write # Add the release tag to the verified MCP image in GHCR.
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/opendart-mcp
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release check confirms the tagged commit is on the default branch.
          fetch-depth: 0
          persist-credentials: false
      - name: Check release tag and commit
        id: release
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags use vX.Y.Z; got $GITHUB_REF_NAME."
            exit 1
          fi
          version=$(python3 -c 'import pathlib, tomllib
          path = pathlib.Path("packages/mcp/pyproject.toml")
          print(tomllib.loads(path.read_text())["project"]["version"])')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match opendart-mcp version $version."
            exit 1
          fi
          commit=$(git rev-parse HEAD)
          if ! git merge-base --is-ancestor "$commit" "origin/$DEFAULT_BRANCH"; then
            echo "::error::Tag a commit on $DEFAULT_BRANCH; $commit is not in its history."
            exit 1
          fi
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Resolve the commit's published digest
        id: image
        env:
          COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          if ! digest=$(docker buildx imagetools inspect "$IMAGE:sha-$COMMIT" --format '{{json .Manifest}}' |
            jq --raw-output --exit-status '.digest'); then
            echo "::error::No published image for $COMMIT. Tag a $DEFAULT_BRANCH commit that CI published" \
              "(version bumps change the image), or run MCP container on $DEFAULT_BRANCH and tag its tip."
            exit 1
          fi
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          # Never move a release tag that has already been distributed.
          if released=$(docker buildx imagetools inspect "$IMAGE:$GITHUB_REF_NAME" \
            --format '{{json .Manifest}}' 2>/dev/null | jq --raw-output --exit-status '.digest'); then
            if [ "$released" != "$digest" ]; then
              echo "::error::$IMAGE:$GITHUB_REF_NAME already refers to $released, not $digest."
              exit 1
            fi
          fi
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          docker pull "$IMAGE@$digest"
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: Verify default-branch signature
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/mcp-container.yml"
          cosign verify "$IMAGE@$IMAGE_DIGEST" \
            --certificate-identity="$identity@refs/heads/$DEFAULT_BRANCH" \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com
      - name: Rescan release digest
        uses: ./.github/actions/scan-container
        with:
          image: ${{ env.IMAGE }}@${{ steps.image.outputs.digest }}
      - name: Promote signed digest to the release tag
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          docker buildx imagetools create --prefer-index=false \
            --tag "$IMAGE:$GITHUB_REF_NAME" "$IMAGE@$IMAGE_DIGEST"
          docker buildx imagetools inspect "$IMAGE:$GITHUB_REF_NAME" --format '{{json .Manifest}}' | \
            jq --exit-status --arg digest "$IMAGE_DIGEST" '.digest == $digest'
          printf 'Promoted `%s` to `%s`.\n' "$IMAGE@$IMAGE_DIGEST" "$IMAGE:$GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
