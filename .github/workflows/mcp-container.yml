name: MCP container

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-container
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/opendart-mcp
      OPENDART_MCP_IMAGE: opendart-mcp:ci
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.20"
          python-version: "3.14"
          enable-cache: true
      - name: Set up Aikido Safe Chain
        uses: ./.github/actions/setup-safe-chain
      - name: Install MCP client
        run: |
          uv safe-chain-verify
          uv sync --locked --package opendart-workspace --package opendart-mcp --no-dev --group hooks
      - name: Lint Dockerfile
        run: uv run --no-sync prek run hadolint-docker --all-files
      - name: Validate Compose configuration
        run: docker compose -f packages/mcp/docker-compose.yml config --quiet
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Read package version
        id: package
        run: |
          uv run --no-sync python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          import tomllib

          project = tomllib.loads(Path("packages/mcp/pyproject.toml").read_text())["project"]
          print(f"version={project['version']}")
          PY
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=sha,format=long
            type=raw,value=run-${{ github.run_id }}-${{ github.run_attempt }}
            type=raw,value=test,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=OpenDART MCP
            org.opencontainers.image.description=OpenDART MCP server over local HTTP
            org.opencontainers.image.version=${{ steps.package.outputs.version }}
      - name: Build container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packages/mcp/Dockerfile
          platforms: linux/amd64
          load: true
          pull: true
          tags: ${{ env.OPENDART_MCP_IMAGE }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=opendart-mcp-linux-amd64
          provenance: false
      - name: Verify SDK, certificates, and runtime user
        run: >-
          docker compose -f packages/mcp/docker-compose.yml run --rm --no-deps -T mcp
          python -c 'import os, ssl, opendart; assert os.getuid() == 10001; assert ssl.create_default_context().get_ca_certs()'
      - name: Test container with Compose restrictions
        run: |
          docker compose -f packages/mcp/docker-compose.yml up --detach --wait --wait-timeout 60 mcp
          uv run --no-sync python scripts/check_mcp.py --url http://127.0.0.1:8000/mcp
          docker compose -f packages/mcp/docker-compose.yml down
      - name: Scan image for fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: v0.76.0
          image-ref: ${{ env.OPENDART_MCP_IMAGE }}
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish container
        id: publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packages/mcp/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=opendart-mcp-linux-amd64
          cache-to: type=gha,scope=opendart-mcp-linux-amd64,mode=max
          provenance: mode=max
          sbom: true
      - name: Pull and test published container by digest
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          export OPENDART_MCP_IMAGE="$IMAGE@$IMAGE_DIGEST"
          docker pull "$OPENDART_MCP_IMAGE"
          docker compose -f packages/mcp/docker-compose.yml up --detach --wait --wait-timeout 60 mcp
          uv run --no-sync python scripts/check_mcp.py \
            --url http://127.0.0.1:8000/mcp
          printf 'Published and verified `%s` (ping -> pong).\n' "$OPENDART_MCP_IMAGE" >> "$GITHUB_STEP_SUMMARY"
      - name: Stop MCP container
        if: always()
        run: docker compose -f packages/mcp/docker-compose.yml down
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
