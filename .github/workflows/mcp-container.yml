name: MCP container

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-container
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/opendart-mcp
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.20"
          python-version: "3.14"
          enable-cache: true
      - name: Set up Aikido Safe Chain
        uses: ./.github/actions/setup-safe-chain
      - name: Install MCP client
        run: |
          uv safe-chain-verify
          uv sync --locked --package opendart-workspace --package opendart-mcp --no-dev --group hooks
      - name: Lint Dockerfile
        run: uv run --no-sync prek run hadolint-docker --all-files
      - name: Validate Compose configuration
        run: docker compose -f packages/mcp/docker-compose.yml config --quiet
      - name: Log in to Docker Hardened Images
        env:
          DHI_USERNAME: ${{ secrets.DHI_USERNAME }}
          DHI_TOKEN: ${{ secrets.DHI_TOKEN }}
        run: |
          if [ -z "$DHI_USERNAME" ] || [ -z "$DHI_TOKEN" ]; then
            echo "::error::Set DHI_USERNAME and DHI_TOKEN repository secrets; see .github/README.md."
            exit 1
          fi
          printf '%s' "$DHI_TOKEN" | docker login dhi.io --username "$DHI_USERNAME" --password-stdin
      - name: Verify Docker Hardened Images
        uses: ./.github/actions/verify-dhi
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Read package version
        id: package
        run: |
          uv run --no-sync python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          import tomllib

          project = tomllib.loads(Path("packages/mcp/pyproject.toml").read_text())["project"]
          print(f"version={project['version']}")
          PY
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=sha,format=long
            type=raw,value=run-${{ github.run_id }}-${{ github.run_attempt }}
            type=raw,value=test,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=OpenDART MCP
            org.opencontainers.image.description=OpenDART MCP server over local HTTP
            org.opencontainers.image.version=${{ steps.package.outputs.version }}
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build and push candidate once
        id: candidate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packages/mcp/Dockerfile
          platforms: linux/amd64
          push: true
          pull: true
          tags: ${{ env.IMAGE }}:candidate-${{ github.run_id }}-${{ github.run_attempt }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=opendart-mcp-linux-amd64
          cache-to: type=gha,scope=opendart-mcp-linux-amd64,mode=max
          provenance: mode=max
          sbom: true
      - name: Pull candidate by immutable digest
        env:
          IMAGE_DIGEST: ${{ steps.candidate.outputs.digest }}
        run: |
          docker pull "$IMAGE@$IMAGE_DIGEST"
      - name: Test exact candidate security and protocol
        uses: ./.github/actions/check-mcp-container
        with:
          image: ${{ env.IMAGE }}@${{ steps.candidate.outputs.digest }}
      - name: Scan exact candidate
        uses: ./.github/actions/scan-container
        with:
          image: ${{ env.IMAGE }}@${{ steps.candidate.outputs.digest }}
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: Sign and verify candidate digest
        env:
          IMAGE_DIGEST: ${{ steps.candidate.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE@$IMAGE_DIGEST"
          cosign verify "$IMAGE@$IMAGE_DIGEST" \
            --certificate-identity="https://github.com/$GITHUB_WORKFLOW_REF" \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com
      - name: Promote verified digest without rebuilding
        env:
          IMAGE_DIGEST: ${{ steps.candidate.outputs.digest }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          tag_arguments=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              tag_arguments+=(--tag "$tag")
            fi
          done <<< "$IMAGE_TAGS"
          docker buildx imagetools create --prefer-index=false \
            "${tag_arguments[@]}" "$IMAGE@$IMAGE_DIGEST"
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | \
                jq --exit-status --arg digest "$IMAGE_DIGEST" '.digest == $digest'
            fi
          done <<< "$IMAGE_TAGS"
          printf 'Tested, scanned, signed, and promoted `%s`.\n' "$IMAGE@$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
      - name: Log out of Docker Hardened Images
        if: always()
        run: docker logout dhi.io
