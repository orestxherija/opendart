name: MCP container

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-container
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/opendart-mcp:test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.20"
          python-version: "3.14"
          enable-cache: true
      - name: Set up Safe Chain
        uses: ./.github/actions/setup-safe-chain
      - name: Install MCP client
        run: |
          uv safe-chain-verify
          uv sync --locked --package opendart-mcp --no-dev
      - name: Build container
        run: docker build --file packages/mcp/Dockerfile --tag "$IMAGE" .
      - name: Test container
        run: uv run --no-sync python scripts/check_mcp.py docker run --rm -i "$IMAGE"
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish container
        run: docker push "$IMAGE"
      - name: Pull and test published container
        run: |
          docker pull "$IMAGE"
          uv run --no-sync python scripts/check_mcp.py docker run --rm -i "$IMAGE"
          printf 'Published and verified `%s` (ping -> pong).\n' "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
