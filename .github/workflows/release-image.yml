name: Release MCP image

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-image-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Promote release image
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # Add release tags to verified GHCR images.
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/opendart-mcp
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release check confirms the tagged commit is on the default branch.
          fetch-depth: 0
          persist-credentials: false
      - name: Check release tag and commit
        id: release
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: scripts/release/check_release_tag.sh "$GITHUB_REF_NAME" "$DEFAULT_BRANCH"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Resolve the commit's published digest
        id: image
        env:
          COMMIT: ${{ steps.release.outputs.commit }}
        run: >-
          scripts/release/resolve_image.sh "$IMAGE" "sha-$COMMIT"
          "Tag a main commit that CI published, or run Publish MCP image on main and tag its tip."
      - name: Verify the publishing signature
        uses: ./.github/actions/verify-image-signature
        with:
          image: ${{ steps.image.outputs.reference }}
      - name: Rescan the release digest
        uses: ./.github/actions/scan-container
        with:
          image: ${{ steps.image.outputs.reference }}
      - name: Promote the digest to the release tag
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: scripts/release/promote_image.sh "$IMAGE" "$DIGEST" "$GITHUB_REF_NAME"
