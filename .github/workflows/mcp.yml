name: MCP checks

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        description: Codecov upload token
        required: false
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mcp:
    name: Python 3.14
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.20"
          python-version: "3.14"
          enable-cache: true
      - name: Set up Aikido Safe Chain
        uses: ./.github/actions/setup-safe-chain
      - name: Install MCP and development dependencies
        run: |
          uv safe-chain-verify
          uv sync --locked --package opendart-workspace --package opendart-mcp
      - name: Lint Dockerfile
        run: uv run --no-sync prek run hadolint-docker --all-files --stage pre-push
      - name: Lint MCP and container checks
        run: uv run --no-sync ruff check packages/mcp scripts/check_mcp.py scripts/check_mcp_runtime.py
      - name: Check MCP and container-check formatting
        run: uv run --no-sync ruff format --check packages/mcp scripts/check_mcp.py scripts/check_mcp_runtime.py
      - name: Check MCP types with mypy
        run: uv run --no-sync mypy packages/mcp/src
      - name: Check MCP types with Pyrefly
        run: uv run --no-sync pyrefly check --config pyrefly.toml packages/mcp/src
      - name: Run MCP tests
        run: uv run --no-sync prek run pytest-mcp --all-files --stage pre-push
      - name: Upload MCP test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcp-test-report
          path: .cache/pytest/mcp-report.html
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload MCP coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          disable_search: true
          fail_ci_if_error: true
          files: .cache/coverage/mcp.xml
          flags: mcp
          name: mcp-python-3.14
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Check MCP protocol
        run: uv run --no-sync python scripts/check_mcp.py
      - name: Build MCP distributions
        run: uv build --package opendart-mcp
      # The image is built, exercised, and scanned by MCP image checks after merges.
      - name: Validate Compose configuration
        run: docker compose -f packages/mcp/docker-compose.yml config --quiet
