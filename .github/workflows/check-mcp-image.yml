name: Check MCP image

on:
  workflow_call:
    inputs:
      verify-base-images:
        description: Verify the DHI base images' signed SBOM and provenance
        type: boolean
        default: true
      scan-vulnerabilities:
        description: Scan the image for vulnerabilities; secrets are always scanned
        type: boolean
        default: true
    secrets:
      DHI_USERNAME:
        description: Docker ID used to pull Docker Hardened Images
        required: true
      DHI_TOKEN:
        description: Docker personal access token with read access to DHI
        required: true

permissions:
  contents: read

jobs:
  image:
    name: Build, test, and scan image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE: opendart-mcp:ci
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up the MCP client
        uses: ./.github/actions/setup
        with:
          sync: --package opendart-workspace --package opendart-mcp --no-dev
      - name: Log in to Docker Hardened Images
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}
      - name: Verify DHI base images
        if: inputs.verify-base-images
        env:
          DOCKER_SCOUT_HUB_USER: ${{ secrets.DHI_USERNAME }}
          DOCKER_SCOUT_HUB_PASSWORD: ${{ secrets.DHI_TOKEN }}
        run: scripts/mcp/verify_dhi.sh
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Generate image labels
        id: meta
        uses: ./.github/actions/image-metadata
        with:
          image: opendart-mcp
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packages/mcp/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          pull: true
          tags: ${{ env.IMAGE }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=opendart-mcp-linux-amd64
          cache-to: type=gha,scope=opendart-mcp-linux-amd64,mode=max
          provenance: false
      - name: Test runtime restrictions, file secrets, and the MCP protocol
        run: scripts/mcp/check_mcp_container.sh "$IMAGE"
      - name: Scan image
        uses: ./.github/actions/scan-container
        with:
          image: ${{ env.IMAGE }}
          vulnerabilities: ${{ inputs.scan-vulnerabilities }}
