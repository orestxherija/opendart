name: Image metadata
description: Generate the MCP image's OCI labels, including its package version.

inputs:
  image:
    description: Image name
    required: true

outputs:
  labels:
    description: OCI labels for docker/build-push-action
    value: ${{ steps.meta.outputs.labels }}

runs:
  using: composite
  steps:
    - name: Read package version
      id: package
      shell: bash
      run: echo "version=$(uv version --package opendart-mcp --short)" >> "$GITHUB_OUTPUT"
    - name: Generate labels
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ${{ inputs.image }}
        flavor: latest=false
        labels: |
          org.opencontainers.image.title=OpenDART MCP
          org.opencontainers.image.description=OpenDART MCP server over local HTTP
          org.opencontainers.image.version=${{ steps.package.outputs.version }}
