name: Verify DHI bases
description: Verify signed SBOM and provenance for the exact DHI base digests using Docker's public key.

runs:
  using: composite
  steps:
    - name: Install checksum-verified Docker Scout CLI
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/docker-scout"
        archive="$RUNNER_TEMP/docker-scout/scout.tar.gz"
        curl --fail --silent --show-error --location --retry 3 \
          https://github.com/docker/scout-cli/releases/download/v1.27.0/docker-scout_1.27.0_linux_amd64.tar.gz \
          --output "$archive"
        printf '%s  %s\n' \
          '815207e27559fd3d7dddfe778e86f0aeb823eeb24b3cd79d00bc5cd8dfd0724d' \
          "$archive" | sha256sum --check --strict
        tar -xzf "$archive" -C "$RUNNER_TEMP/docker-scout" docker-scout
    - name: Verify base-image attestations
      shell: bash
      run: |
        mapfile -t images < <(awk '$1 == "FROM" && $2 ~ /^dhi[.]io\// {print $2}' packages/mcp/Dockerfile)
        test "${#images[@]}" -eq 2
        for image in "${images[@]}"; do
          [[ "$image" =~ @sha256:[a-f0-9]{64}$ ]]
          for predicate in https://scout.docker.com/sbom/v0.1 https://slsa.dev/provenance/v1; do
            report="$RUNNER_TEMP/docker-scout/attestation.json"
            # DHI may omit Rekor records. Verify Docker's signature, skipping only
            # the transparency-log requirement as documented by Docker.
            "$RUNNER_TEMP/docker-scout/docker-scout" attest get "registry://$image" \
              --platform linux/amd64 --predicate-type "$predicate" \
              --verify --skip-tlog --output "$report"
            jq --exit-status --arg predicate "$predicate" \
              '.predicateType == $predicate and (.subject | length > 0)' "$report"
          done
        done
