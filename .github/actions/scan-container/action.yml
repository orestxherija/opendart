name: Scan container
description: Retain all vulnerability findings and gate fixable HIGH/CRITICAL CVEs and secrets.

inputs:
  image:
    description: Image tag or immutable digest to scan
    required: true

runs:
  using: composite
  steps:
    - name: Report all vulnerabilities including unfixed findings
      uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
      with:
        version: v0.76.0
        image-ref: ${{ inputs.image }}
        scanners: vuln
        format: json
        output: ${{ runner.temp }}/container-vulnerabilities.json
        severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
        ignore-unfixed: false
        exit-code: "0"
    - name: Gate fixable high and critical vulnerabilities
      uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
      with:
        version: v0.76.0
        image-ref: ${{ inputs.image }}
        scanners: vuln
        format: table
        severity: HIGH,CRITICAL
        ignore-unfixed: true
        exit-code: "1"
    - name: Scan image for secrets
      if: ${{ !cancelled() }}
      uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
      with:
        version: v0.76.0
        image-ref: ${{ inputs.image }}
        scanners: secret
        format: table
        severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
        exit-code: "1"
    - name: Retain vulnerability report
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: container-vulnerabilities-${{ github.job }}
        path: ${{ runner.temp }}/container-vulnerabilities.json
        if-no-files-found: warn
        retention-days: 30
