name: Set up Safe Chain
description: Install a pinned, checksum-verified Aikido Safe Chain release for CI.

runs:
  using: composite
  steps:
    - name: Install Safe Chain 1.5.25
      shell: bash
      run: |
        installer="$RUNNER_TEMP/install-safe-chain.sh"
        curl --fail --silent --show-error --location --retry 3 \
          https://github.com/AikidoSec/safe-chain/releases/download/1.5.25/install-safe-chain.sh \
          --output "$installer"
        printf '%s  %s\n' \
          '83069f6db4215cccf6a26bdd6e65a5c2366b9d24322b2d5d2862d47385e56682' \
          "$installer" | sha256sum --check --strict
        sh "$installer" --ci
    - name: Verify Safe Chain installation
      shell: bash
      run: safe-chain --version
