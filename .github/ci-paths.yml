# CI matches a filter when a changed file matches one of its patterns and none
# of its !patterns; an exclusion cannot be overridden within that filter.

# Changes to shared tooling affect every component. Keep this list in one place.
shared: &shared
  - 'pyproject.toml'
  - 'uv.toml'
  - 'uv.lock'
  - '.python-version'
  - '.github/ci-paths.yml'
  - '.github/workflows/ci.yml'
  - '.github/actions/setup-safe-chain/**'

# Lint and test configuration used by every Python check workflow.
python: &python
  - 'ruff.toml'
  - 'pytest.toml'

# File style, Ruff, spelling, file-length policy, and secret scanning cover the
# whole repository, including docs and dotfiles. Keep these checks selected even
# when every component check is skipped.
quality:
  - '**'

# Zizmor audits GitHub automation; pip-audit audits the lockfile. Scheduled runs
# catch advisories published after these files last changed.
audit:
  - 'prek.toml'
  - 'zizmor.yaml'
  - 'uv.lock'
  - 'scripts/pip_audit.sh'
  - '.github/dependabot.yml'
  - '.github/actions/**'
  - '.github/workflows/**'

# Coordinated versions and release-helper tests.
release:
  - *shared
  - *python
  - '.github/workflows/release.yml'
  - 'cz.toml'
  - 'packages/sdk/pyproject.toml'
  - 'packages/mcp/pyproject.toml'
  - 'scripts/check_release.py'
  - 'scripts/smoke_distributions.py'
  - 'scripts/smoke_installed.py'
  - 'tests/release/**'

# Expensive: build both distributions and smoke-test isolated installations.
# Package tests and docs cannot change whether they build, validate, or install.
distributions:
  - *shared
  - '.github/workflows/release.yml'
  - 'cz.toml'
  - 'packages/sdk/**'
  - 'packages/mcp/**'
  - '!packages/*/tests/**'
  - '!packages/*/docs/**'
  - 'scripts/check_release.py'
  - 'scripts/smoke_distributions.py'
  - 'scripts/smoke_installed.py'

# Package docs are not checked by component workflows; repository quality covers
# their Markdown, including Python examples linted by Ruff.
sdk:
  - *shared
  - *python
  - 'prek.toml'
  - 'pyrefly.toml'
  - 'codecov.yml'
  - '.github/workflows/sdk.yml'
  - 'packages/sdk/**'
  - '!packages/sdk/docs/**'
  - 'scripts/generate_sdk.py'
  # These files define or generate the contract consumed by the SDK.
  - 'api_reference/openapi.yaml'
  - 'api_reference/parameters.yaml'
  - 'api_reference/examples.yaml'
  - 'api_reference/paths/**'
  - 'api_reference/schemas/**'
  - 'api_reference/sources/**'
  - 'scripts/api_reference/build.py'
  - 'scripts/api_reference/snapshot.py'

mcp:
  - *shared
  - *python
  - 'prek.toml'
  - 'pyrefly.toml'
  - 'codecov.yml'
  - '.hadolint.yaml'
  - '.github/workflows/mcp.yml'
  # Includes components.lock.json, which the component check compares.
  - 'packages/mcp/**'
  # A registry test parses COMPONENT_DESIGN.md, so only the other package docs
  # are excluded. Only a leading ! negates; !(...) is an extglob.
  - '!packages/mcp/docs/!(COMPONENT_DESIGN.md)'
  - '!packages/mcp/docs/*/**'
  - 'scripts/check_mcp.py'
  - 'scripts/check_mcp_runtime.py'
  - 'scripts/check_mcp_components.py'
  - 'scripts/check_mcp_conformance.py'
  # The registry generator and its inputs: the catalog, the operation documents,
  # and the SDK generator's naming rules.
  - 'scripts/generate_mcp_registry.py'
  - 'scripts/generate_sdk.py'
  - 'api_reference/sources/catalog.json'
  - 'api_reference/paths/**'
  # MCP installs the SDK; changes to SDK tests or its generator alone do not
  # change the installed package.
  - 'packages/sdk/src/**'
  - 'packages/sdk/pyproject.toml'
  - 'packages/sdk/README.md'

# Expensive: build, exercise, and scan the MCP image. This mirrors the
# .dockerignore allowlist without READMEs, which add only package metadata.
# On pushes to main, the same paths select publishing after CI passes.
container:
  - *shared
  - '.dockerignore'
  - '.github/workflows/mcp-image.yml'
  - '.github/actions/check-mcp-container/**'
  - '.github/actions/scan-container/**'
  - '.github/actions/verify-dhi/**'
  - 'packages/mcp/Dockerfile'
  - 'packages/mcp/docker-compose.yml'
  - 'packages/mcp/compose.secrets.yml'
  - 'packages/mcp/pyproject.toml'
  - 'packages/mcp/src/**'
  - 'packages/sdk/pyproject.toml'
  - 'packages/sdk/src/**'
  - 'scripts/check_mcp.py'
  - 'scripts/check_mcp_runtime.py'
  # The protocol check expects every default tool recorded in the lock.
  - 'packages/mcp/components.lock.json'

# Publishing only: the publisher runs on main alone, so a pull request image
# check would not exercise it. Merging a change to it republishes the image.
publisher:
  - '.github/workflows/mcp-container.yml'

# Within an image check, verify DHI attestations only when the base digests
# pinned in the Dockerfile, or their verification, change.
base-images:
  - 'packages/mcp/Dockerfile'
  - '.github/actions/verify-dhi/**'
  - '.github/workflows/mcp-image.yml'

# Image vulnerabilities come from the base images and locked dependencies, not
# from package source. The daily published-image scan covers new advisories.
vulnerabilities:
  - '.dockerignore'
  - 'packages/mcp/Dockerfile'
  - 'uv.lock'
  - '.github/actions/scan-container/**'
  - '.github/workflows/mcp-image.yml'

# Top-level guides in api_reference/ are covered by repository quality.
reference:
  - *shared
  - *python
  - 'prek.toml'
  - '.github/workflows/pages.yml'
  - 'api_reference/**'
  - '!api_reference/*.md'
  - 'scripts/api_reference/**'
  - 'tests/__init__.py'
  - 'tests/contracts/**'
