[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "opendart-mcp"
version = "0.1.0"
description = "Local HTTP OpenDART MCP server backed by opendart-sdk"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "mcp>=2,<3",
  "opendart-sdk>=0.1.0,<0.2",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
]

[project.scripts]
opendart-mcp = "opendart_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/opendart_mcp"]
# Keep both formats compatible with the locked Twine release validator.
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
