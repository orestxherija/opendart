services:
  mcp:
    image: ${OPENDART_MCP_IMAGE:-opendart-mcp:dev}
    # Build locally or explicitly pull the selected published image before running.
    pull_policy: never
    build:
      context: ../..
      dockerfile: packages/mcp/Dockerfile
    environment:
      OPENDART_MCP_HTTP__HOST: "0.0.0.0"
      OPENDART_MCP_HTTP__PORT: "8000"
    ports:
      - "127.0.0.1:${OPENDART_MCP_HTTP__PORT:-8000}:8000"
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    cpus: "1.0"
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 64
    init: true
    stop_grace_period: 10s
    restart: unless-stopped
    # Bound retained service logs; MCP responses travel over HTTP.
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
