<header>
  <h1 id="title">Peer comparison</h1>
  <span id="subtitle" class="muted"></span>
</header>
<nav id="metrics" class="toolbar" aria-label="Metric set"></nav>
<p id="status" class="status muted" role="status" aria-live="polite">Waiting for data…</p>
<div class="wrap"><table><thead id="head"></thead><tbody id="body"></tbody></table></div>
<p class="muted small">
  Shaded cells mark each column's <span class="hi">highest</span> and <span class="lo">lowest</span> value.
  Select a heading to sort.
</p>
<div id="missing" class="callout" role="note" hidden></div>
<pre id="fallback" class="fallback" hidden></pre>
<footer class="muted small">
  <ul id="notes" class="notes"></ul>
  <p id="sources"></p>
</footer>
