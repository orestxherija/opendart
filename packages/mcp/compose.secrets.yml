# Optional: docker compose -f packages/mcp/docker-compose.yml -f packages/mcp/compose.secrets.yml up --detach --wait
services:
  mcp:
    secrets:
      - source: opendart_api_key
        target: OPENDART_API__API_KEY

secrets:
  opendart_api_key:
    # Use an absolute host path; its contents never become a container env variable.
    file: ${OPENDART_API_KEY_FILE:?Set OPENDART_API_KEY_FILE to an absolute API key file path}
