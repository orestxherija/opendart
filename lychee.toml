extensions = ["md"]
hidden = true
exclude_path = ['(^|/)\.agents/plugins/python-conventions/']
include_verbatim = false
include_mail = false
include_fragments = "anchor-only"
scheme = ["http", "https", "file"]
exclude_all_private = true
skip_missing = false
require_https = true
accept = ["200..=299"]
timeout = 30
max_retries = 2
retry_wait_time = 2
max_concurrency = 16
host_concurrency = 4
host_request_interval = "100ms"
no_progress = true
format = "compact"

exclude = [
    # FSS requires unsupported TLS suites or an API key.
    '^https?://(?:eng)?opendart\.fss\.or\.kr(?:/|$)',
    # Anonymous Docker dashboard requests enter an OAuth redirect loop.
    '^https://app\.docker\.com/?$',
    # Private workflow URLs return 404 to anonymous requests.
    '^https://github\.com/orestxherija/opendart/actions/workflows/ci\.yml\?query=branch%3Amain$',
    '^https://github\.com/orestxherija/opendart/actions/workflows/ci\.yml/badge\.svg\?branch=main$',
]
