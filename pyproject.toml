[project]
name = "opendart-workspace"
version = "0.1.0"
description = "Workspace for the OpenDART Python SDK and MCP server"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/sdk", "packages/mcp"]

[tool.uv.sources]
opendart-sdk = { workspace = true }

[dependency-groups]
hooks = ["prek>=0.4.13,<0.5"]
contracts = [
  "schemathesis==4.32.0",
  "hypothesis>=6,<7",
  "requests>=2,<3",
  "PyYAML==6.0.3",
  "jsonschema==4.26.0",
  "defusedxml>=0.7,<1",
]
test = [
  "anyio>=4,<5",
  "pytest>=8,<10",
  "pytest-cov>=7,<8",
  "PyYAML==6.0.3",
  "openapi-spec-validator==0.9.0",
  "jsonschema==4.26.0",
]
quality = [
  "ruff>=0.17.1,<0.18",
  "mypy>=1.15,<2",
  "types-PyYAML>=6,<7",
]
# uv installs dev by default. Group includes keep the tool requirements in one place.
dev = [
  { include-group = "hooks" },
  { include-group = "test" },
  { include-group = "quality" },
]

[tool.pytest.ini_options]
testpaths = ["packages/sdk/tests", "packages/mcp/tests"]
addopts = "-ra --cov --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
branch = true
relative_files = true
source = ["packages/sdk/src/opendart"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.14"
strict = true
files = ["packages/sdk/src", "packages/mcp/src"]
plugins = ["pydantic.mypy"]
