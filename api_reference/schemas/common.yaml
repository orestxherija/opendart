        - '013'
        - '014'
        - '020'
        - '021'
        - '100'
        - '101'
        - '800'
        - '900'
        - '901'
      message:
        type: string
        description: Upstream diagnostic text; wording and language are not stable.
  ZipArchive:
    type: string
    format: binary
    description: ZIP archive bytes, despite the .xml request suffix.
responses:
