# Generated by scripts/build.py from sources/catalog.json; see README.md.
ListSuccess:
  type: object
  description: Search disclosures. Scalar report fields are modeled as strings; the guide does not specify scalar
    JSON types or guarantee field presence. Pagination counters are modeled as integers. Additional upstream fields
    are allowed.
  additionalProperties: true
  properties:
    status:
      type: string
      enum:
      - '000'
      description: Successful application status.
    message:
      type: string
      description: Error and information message. (※ See message description)
    page_no:
      type: integer
      minimum: 0
      description: Page No.
    page_count:
      type: integer
      minimum: 0
      description: Results per page
    total_count:
      type: integer
      minimum: 0
      description: Total results
    total_page:
      type: integer
      minimum: 0
      description: Total pages
    list:
      type: array
      description: Repeated list records.
      items:
        type: object
        description: Documented fields; availability depends on the submitted disclosure.
        additionalProperties: true
        properties:
          corp_cls:
            type: string
            description: 'Corporation type. Corporation type: Y (KOSPI), K (KOSDAQ), N (KONEX), E (Other)'
          corp_name:
            type: string
            description: Item name (corporation name). The item name (listed company) or corporation name (other
              corporation) of the corporation subject to disclosure
          corp_code:
            type: string
            description: Corporation code. Corporation code of the corporation subject to disclosure (8 digits)
          stock_code:
            type: string
            description: Item code. Listed corporation’s item code (6 digits)
          report_nm:
            type: string
            description: 'Report title. Disclosure type + report name + other information [Revision of statements]:
              A report previously submitted under this title was corrected in its descriptions and re-submitted.
              [Corrected attachment]: A report previously submitted under this title was re-submitted when the substance
              of at least one attachment was modified. [Added attachment]: A report previously submitted under this
              title was re-submitted when one or more attachment was added. [Modified registration]: A report previously
              submitted under this title was re-submitted when its asset securitization was modified. [Decision
              to extend]: A report previously submitted under this title was re-submitted since the trust contract
              was extended. [Conditions for issuance finalized]: A report previously submitted under this title
              was re-submitted upon the finalization of the conditions for issuing marketable securities. [Correction
              order imposed]: The Financial Supervisory Service issued a correction order on this report. [Requested
              submission of correction]: The Financial Supervisory Service imposed a request for a correction on
              this report.'
          rcept_no:
            type: string
            description: 'Filing No.. Filing No. (14 digits) ※ Example link to Disclosure Viewer - For PCs: https://englishdart.fss.or.kr/dsbh001/main.do?rcpNo=FilingNumber'
          flr_nm:
            type: string
            description: Disclosure submitter name
          rcept_dt:
            type: string
            description: Filing date. Disclosure filing date (YYYYMMDD)
          rm:
            type: string
            description: 'Note. The individual letters in the combinations have the following meanings: S: This
              disclosure is under the authority of the KOSPI Market Division of the Korea Exchange. K: This disclosure
              is under the authority of the KOSDAQ Market Division of the Korea Exchange. B: This document is a
              disclosure item of a bonds listed company of the Korea Exchange. N: This document is under the authority
              of the KONEX Market of the Korea Exchange. F: This disclosure is under the authority of the Fair Trade
              Commission. C: This report includes consolidated portions. U: A correction report was made after the
              submission of this report; see the relevant report. W: This report was (deemed) withdrawn; see the
              relevant withdrawal statement (notice of deemed withdrawal).'
        xml:
          name: list
      xml:
        name: list
        wrapped: false
  required:
  - status
  - message
  xml:
    name: result
ListResponse:
  description: Success or an application-level error in the same HTTP response.
  anyOf:
  - $ref: '#/ListSuccess'
  - $ref: ./common.yaml#/schemas/ApplicationError
  xml:
    name: result
