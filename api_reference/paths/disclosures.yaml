/list.json:
  get:
    tags:
    - disclosures
    summary: Search disclosures (JSON)
    description: Search functions are provided to search disclosure reports by different filters including disclosure
      type, company, date, etc. See the linked official guide for coverage and availability. Without corp_code the
      date interval is limited to three months. bgn_de defaults to end_de; end_de defaults to the current date.
      Pagination starts at 1, with 10 records by default and at most 100 per page.
    operationId: getListJson
    externalDocs:
      url: https://engopendart.fss.or.kr/guide/detail.do?apiGrpCd=DE001&apiId=AE00001
      description: Official endpoint guide
    x-upstream-api-id: AE00001
    parameters:
    - $ref: ../parameters.yaml#/List_corp_code
