    - $ref: ../parameters.yaml#/List_end_de
    - $ref: ../parameters.yaml#/List_last_reprt_at
    - $ref: ../parameters.yaml#/List_pblntf_ty
    - $ref: ../parameters.yaml#/List_pblntf_detail_ty
    - $ref: ../parameters.yaml#/List_corp_cls
    - $ref: ../parameters.yaml#/List_sort
    - $ref: ../parameters.yaml#/List_sort_mth
    - $ref: ../parameters.yaml#/List_page_no
    - $ref: ../parameters.yaml#/List_page_count
    responses:
      '200':
        description: Upstream result. Inspect the application status; HTTP success alone does not indicate API success.
        content:
          application/json:
            schema:
              $ref: ../schemas/disclosures.yaml#/ListResponse
            examples:
              success:
                summary: Synthetic shape illustration; not a captured response
                value:
                  status: '000'
                  message: Normal
                  page_no: 1
                  page_count: 10
                  total_count: 1
                  total_page: 1
                  list:
                  - corp_cls: 'Y'
                    corp_name: Example corporation
                    corp_code: '00126380'
                    stock_code: '005930'
                    report_nm: ''
                    rcept_no: '20190401004781'
                    flr_nm: ''
                    rcept_dt: '20190401'
                    rm: ''
              noData:
                summary: Synthetic no-data result; list may be absent
                value:
                  status: '013'
                  message: No data
              invalidParameters:
                summary: Synthetic missing or invalid parameter result (including a missing key)
                value:
                  status: '100'
                  message: Missing or invalid parameter
              quotaExceeded:
