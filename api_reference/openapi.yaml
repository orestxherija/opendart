info:
  title: OpenDART English API — consumer-maintained reference
  version: 0.1.0
  description: 'Unofficial reconstruction of the English OpenDART developer guides, maintained by API consumers.
    The Financial Supervisory Service (FSS) operates the upstream API; this repository neither owns nor controls
    it. This version identifies this reference, not an upstream release.


    Use the documented HTTPS /engapi server. The Korean /api service is a separate contract and is outside this
    reference. Every call requires the 40-character crtfc_key query credential; configure it through ApiKeyAuth.
    Select JSON or XML using the route suffix, not content negotiation.


    Application status 000 indicates success. Non-success status values, including 013 (no data) and 020 (quota),
    are response-body codes, not HTTP status codes. Always inspect status. The upstream guide mentions a usual 20,000-request
    quota but explicitly allows different thresholds; no fixed rate, reset time, retry policy, or Retry-After header
    is promised.


    Identifiers and financial values retain their upstream string representation. Date query values use YYYYMMDD,
    not RFC 3339 dates. Unknown response properties are allowed, and report fields are optional because presence
    depends on disclosure content. Examples are synthetic illustrations, not captured or guaranteed filings.


    The guides do not fully specify scalar response types, XML serialization, HTTP error mappings, or media headers.
    The source snapshot and sanitized live observations are retained in sources/. Bounded Schemathesis audits check
    observed responses, not every possible filing. FSS cautions that extracted report data may be incomplete or
    later corrected.'
  termsOfService: https://engopendart.fss.or.kr/intro/terms.do
